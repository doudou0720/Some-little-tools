<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节目单</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bootstrap.min.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bootstrap-icons.min.css') }}" />
    <script src="{{ url_for('static',filename='js/bootstrap.bundle.js') }}"></script>
    <style>
        body {
            padding-top: 60px;
            background-color: #f8f9fa;
        }
        .song-card {
            transition: transform 0.2s;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .song-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }
        .song-img {
            height: 200px;
            object-fit: cover;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .card-text {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 0.25rem;
        }
        .play-btn {
            width: 100%;
        }
        /* 播放列表按钮样式 */
        .playlist-btn {
            width: 100%;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar fixed-top bg-primary navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Audio Player by doudou0528</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="my-4 text-center">
            <i class="bi bi-music-note-list"></i> 节目单
        </h2>
        
        {% if songs %}
        <div class="row">
            {% for song in songs %}
            <div class="col-md-4 col-sm-6">
                <div class="card song-card">
                    <img src="{{ url_for('static', filename='images/' + song.Img) }}" 
                         class="card-img-top song-img" 
                         alt="{{ song.Song }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ song.Song }}</h5>
                        <p class="card-text">
                            <i class="bi bi-person"></i> {{ song.Artist }}
                        </p>
                        <p class="card-text">
                            <i class="bi bi-disc"></i> {{ song.Disc }}
                        </p>
                        <a href="{{ url_for('play') }}?uuid={{ song.UUID }}" 
                           class="btn btn-primary play-btn">
                            <i class="bi bi-play-circle"></i> 播放歌曲
                        </a>
                        <button class="btn btn-outline-secondary playlist-btn" 
                                data-uuid="{{ song.UUID }}" 
                                data-name="{{ song.Song }}">
                            <i class="bi bi-plus-circle"></i> 添加到节目单
                        </button>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="alert alert-info text-center" role="alert">
            <i class="bi bi-info-circle"></i> 暂无歌曲信息
        </div>
        {% endif %}
        
    </div>

    <script src="{{ url_for('static',filename='js/jquery-3.6.1.js') }}"></script>
    <script>
        $(document).ready(function() {
            // 添加一些交互效果
            $('.song-card').on('mouseenter', function() {
                $(this).find('.card-title').addClass('text-primary');
            }).on('mouseleave', function() {
                $(this).find('.card-title').removeClass('text-primary');
            });
            
            // 添加到播放列表按钮事件
            $('.playlist-btn').on('click', function() {
                const songUuid = $(this).data('uuid');
                const songName = $(this).data('name');
                
                // 创建临时session_id用于演示（实际应用中应该使用真实session）
                const sessionId = 'demo-session-' + Date.now();
                
                // 发送请求添加到播放列表
                fetch('/api/playlist', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        session_id: sessionId,
                        song_uuid: songUuid
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // 显示成功消息
                        const originalText = $(this).html();
                        $(this).html('<i class="bi bi-check-circle"></i> 已添加');
                        $(this).removeClass('btn-outline-secondary').addClass('btn-success');
                        
                        // 3秒后恢复原状
                        setTimeout(() => {
                            $(this).html(originalText);
                            $(this).removeClass('btn-success').addClass('btn-outline-secondary');
                        }, 3000);
                        
                        // 重新加载历史记录
                        loadPlaylistsHistory();
                    } else {
                        alert('添加到播放列表失败: ' + data.error);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('添加到播放列表时发生错误');
                });
            });
            
            // 加载播放列表历史记录
            function loadPlaylistsHistory() {
                fetch('/api/playlists/history')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        displayPlaylistsHistory(data.history);
                    } else {
                        $('#playlists-history').html('<div class="alert alert-warning">加载播放列表历史失败</div>');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    $('#playlists-history').html('<div class="alert alert-danger">加载播放列表历史时发生错误</div>');
                });
            }
            
            // 显示播放列表历史记录
            function displayPlaylistsHistory(history) {
                const container = $('#playlists-history');
                
                if (history.length === 0) {
                    container.html('<div class="alert alert-info text-center">暂无播放列表历史记录</div>');
                    return;
                }
                
                let html = '';
                history.forEach((playlist, index) => {
                    // 格式化时间戳
                    const updatedAt = new Date(playlist.updated_at * 1000);
                    const timeString = updatedAt.toLocaleString('zh-CN');
                    
                    html += `
                    <div class="history-item">
                        <div class="history-header">
                            <h5>播放列表 #${index + 1}</h5>
                            <div>
                                <span class="badge bg-secondary me-2">${playlist.song_count} 首歌曲</span>
                                <span class="timestamp">${timeString}</span>
                            </div>
                        </div>
                        <div class="history-songs">
                    `;
                    
                    playlist.songs.forEach(song => {
                        html += `
                        <div class="history-song">
                            <img src="${'/static/images/' + song.img}" 
                                 class="history-song-img" 
                                 alt="${song.name}">
                            <span>${song.name}</span>
                        </div>
                        `;
                    });
                    
                    html += `
                        </div>
                    </div>
                    `;
                });
                
                container.html(html);
            }
            
            // 初始加载播放列表历史记录
            loadPlaylistsHistory();
        });
    </script>
</body>
</html>
