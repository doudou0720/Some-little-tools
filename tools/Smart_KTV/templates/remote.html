<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遥控器</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bootstrap.min.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bootstrap-icons.min.css') }}" />
    <script src="{{ url_for('static',filename='js/bootstrap.bundle.js') }}"></script>
    <style>
        body {
            background-color: #333;
            color: white;
            padding: 20px;
        }
        .remote-btn {
            width: 80px;
            height: 80px;
            margin: 10px;
            font-size: 24px;
            border-radius: 50%;
        }
        .control-panel {
            background-color: #444;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        .progress-container {
            background-color: #555;
            border-radius: 10px;
            height: 20px;
            margin: 15px 0;
        }
        .progress-bar {
            height: 100%;
            background-color: #007bff;
            border-radius: 10px;
            transition: width 0.1s;
        }
        .volume-slider {
            width: 100%;
            margin: 15px 0;
        }
        /* 添加独立音量控制样式 */
        .individual-volume-control {
            margin: 10px 0;
        }
        .connection-status {
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            margin-bottom: 20px;
        }
        .connected {
            background-color: #28a745;
        }
        .disconnected {
            background-color: #dc3545;
        }
        .song-selector {
            width: 100%;
            margin: 15px 0;
            background-color: #555;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px;
        }
        /* 添加校准状态样式 */
        .calibration-info {
            background-color: #555;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
        }
        /* 播放列表样式 */
        .playlist-container {
            background-color: #444;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }
        .playlist-item {
            background-color: #555;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .playlist-item .song-info {
            flex-grow: 1;
        }
        .playlist-item .song-title {
            font-weight: bold;
        }
        .playlist-item .song-artist {
            font-size: 0.8em;
            color: #ccc;
        }
        .playlist-item .remove-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">
            <i class="bi bi-remote-control"></i> 遥控器
        </h2>
        
        <div id="connection-status" class="connection-status disconnected">
            <i class="bi bi-wifi-off"></i> 未连接
        </div>
        
        <div class="control-panel">
            <div class="text-center">
                <h4 id="song-title">-</h4>
                <p id="artist">-</p>
            </div>
            
            <!-- 添加歌曲选择器 -->
            <div class="form-group">
                <label for="song-selector">选择歌曲</label>
                <select id="song-selector" class="song-selector">
                    <option value="">选择歌曲</option>
                </select>
            </div>
            
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
            </div>
            
            <div class="d-flex justify-content-between">
                <span id="current-time">00:00</span>
                <span id="duration">00:00</span>
            </div>
            
            <!-- 添加进度条 -->
            <input type="range" id="progress-slider" class="volume-slider" min="0" max="100" value="0">
            
            <div class="text-center my-4">
                <!-- 合并播放和暂停按钮 -->
                <button id="play-pause-btn" class="btn btn-primary remote-btn">
                    <i class="bi bi-play-fill"></i>
                </button>
            </div>
            
            <div class="volume-control" style="display: none;">
                <label for="volume-slider">音量控制</label>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100">
            </div>
            
            <!-- 添加独立音量控制 -->
            <div class="individual-volume-control">
                <label for="audio1-volume-slider">伴奏音量</label>
                <input type="range" id="audio1-volume-slider" class="volume-slider" min="0" max="100" value="100">
                
                <label for="audio2-volume-slider">人声音量</label>
                <input type="range" id="audio2-volume-slider" class="volume-slider" min="0" max="100" value="100">
            </div>
            
            <div class="text-center" style="display: none;">
                <button id="vol-up-btn" class="btn btn-primary remote-btn">
                    <i class="bi bi-volume-up"></i>
                </button>
                <button id="vol-down-btn" class="btn btn-primary remote-btn">
                    <i class="bi bi-volume-down"></i>
                </button>
            </div>
            
            <!-- 添加音频校准控制 -->
            <div class="calibration-info">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span>同步状态:</span>
                    <span id="remote-sync-status" class="text-warning">未知</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span>上次校准:</span>
                    <span id="remote-last-calibration">-</span>
                </div>
                <button id="calibrate-btn" class="btn btn-warning w-100">手动校准</button>
            </div>
        </div>
        
        <!-- 添加播放列表 -->
        <div class="playlist-container">
            <h4 class="mb-3">
                <i class="bi bi-list-ul"></i> 播放列表
                <button id="clear-playlist-btn" class="btn btn-sm btn-danger float-end">清空</button>
            </h4>
            <div id="playlist-items">
                <div class="text-center py-3 text-muted" id="playlist-empty-message">
                    播放列表为空
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static',filename='js/jquery-3.6.1.js') }}"></script>
    <script>
        let ws = null;
        let isConnected = false;
        let sessionId = null;
        let currentSong = {
            title: "-",
            artist: "-",
            duration: 0,
            currentTime: 0
        };
        // 添加独立音量变量
        let audio1Volume = 1.0;
        let audio2Volume = 1.0;
        // 添加播放状态变量
        let isPlaying = false;
        // 添加连接状态检查定时器
        let heartbeatInterval = null;
        let heartbeatTimeout = null;
        let isPlayPageConnected = false;
        // 添加音频同步状态变量
        let syncStatus = 'unknown';
        let lastCalibrationTime = null;
        
        // 从URL参数获取session_id
        function getSessionIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('session_id');
        }
        
        // 添加到播放列表
        function addToPlaylist(songUuid) {
            if (!sessionId || !songUuid) return;
            
            fetch('/api/playlist', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    session_id: sessionId,
                    song_uuid: songUuid
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    loadPlaylist(); // 重新加载播放列表
                } else {
                    console.error('添加到播放列表失败:', data.error);
                }
            })
            .catch(error => {
                console.error('添加到播放列表出错:', error);
            });
        }
        
        // 从播放列表移除
        function removeFromPlaylist(songUuid) {
            if (!sessionId || !songUuid) return;
            
            fetch(`/api/playlist/${sessionId}/${songUuid}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    loadPlaylist(); // 重新加载播放列表
                } else {
                    console.error('从播放列表移除失败:', data.error);
                }
            })
            .catch(error => {
                console.error('从播放列表移除出错:', error);
            });
        }
        
        // 清空播放列表
        function clearPlaylist() {
            if (!sessionId) return;
            
            fetch(`/api/playlist/${sessionId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    loadPlaylist(); // 重新加载播放列表
                } else {
                    console.error('清空播放列表失败:', data.error);
                }
            })
            .catch(error => {
                console.error('清空播放列表出错:', error);
            });
        }
        
        // 加载播放列表
        function loadPlaylist() {
            if (!sessionId) return;
            
            fetch(`/api/playlist/${sessionId}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    displayPlaylist(data.songs);
                } else {
                    console.error('加载播放列表失败:', data.error);
                }
            })
            .catch(error => {
                console.error('加载播放列表出错:', error);
            });
        }
        
        // 显示播放列表
        function displayPlaylist(songs) {
            const playlistContainer = document.getElementById('playlist-items');
            const emptyMessage = document.getElementById('playlist-empty-message');
            
            // 清空现有内容
            playlistContainer.innerHTML = '';
            
            if (songs.length === 0) {
                // 显示空列表消息
                playlistContainer.appendChild(emptyMessage);
                emptyMessage.style.display = 'block';
                return;
            }
            
            // 隐藏空列表消息
            emptyMessage.style.display = 'none';
            
            // 添加歌曲到播放列表
            songs.forEach((song, index) => {
                const playlistItem = document.createElement('div');
                playlistItem.className = 'playlist-item';
                playlistItem.innerHTML = `
                    <div class="song-info">
                        <div class="song-title">${song.name}</div>
                        <div class="song-artist">${song.artist || '-'}</div>
                    </div>
                    <div>
                        <button class="play-btn btn btn-sm btn-primary me-2" data-uuid="${song.uuid}">
                            <i class="bi bi-play-fill"></i>
                        </button>
                        <button class="remove-btn" data-uuid="${song.uuid}">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                `;
                playlistContainer.appendChild(playlistItem);
            });
            
            // 绑定播放按钮事件
            document.querySelectorAll('.play-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const songUuid = this.getAttribute('data-uuid');
                    sendCommand('change_song_by_uuid', {song_uuid: songUuid});
                });
            });
            
            // 绑定移除按钮事件
            document.querySelectorAll('.remove-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const songUuid = this.getAttribute('data-uuid');
                    removeFromPlaylist(songUuid);
                });
            });
        }
        
        function connectWebSocket() {
            try {
                sessionId = getSessionIdFromUrl();
                if (!sessionId) {
                    console.error("缺少session_id参数");
                    return;
                }
                
                // 修正WebSocket连接URL，使用路径参数而不是查询参数
                ws = new WebSocket(`ws://${window.location.host}/websocket_remote/${sessionId}`);
                
                ws.onopen = function(event) {
                    console.log("WebSocket连接已建立");
                    isConnected = true;
                    isPlayPageConnected = true; // 连接建立时设置为已连接
                    updateConnectionStatus(); // 连接建立时更新状态显示
                    // 连接成功后主动请求状态信息
                    setTimeout(() => {
                        sendCommand('get_status');
                        sendCommand('get_volume');
                        sendCommand('get_current_song'); // 添加获取当前歌曲信息
                    }, 100);
                    // 启动心跳检测
                    startHeartbeat();
                    // 加载歌曲列表
                    loadSongList();
                    // 加载播放列表
                    loadPlaylist();
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        handleServerMessage(data);
                    } catch (e) {
                        console.error("处理服务器消息出错:", e);
                    }
                };
                
                ws.onclose = function(event) {
                    console.log("WebSocket连接已关闭");
                    isConnected = false;
                    isPlayPageConnected = false;
                    updateConnectionStatus();
                    stopHeartbeat();
                    // 尝试重连
                    setTimeout(connectWebSocket, 3000);
                };
                
                ws.onerror = function(error) {
                    console.error("WebSocket错误:", error);
                };
            } catch (e) {
                console.error("WebSocket连接失败:", e);
            }
        }
        
        // 启动心跳检测
        function startHeartbeat() {
            stopHeartbeat();
            heartbeatInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    sendCommand('ping');
                    // 设置超时检测
                    heartbeatTimeout = setTimeout(() => {
                        isPlayPageConnected = false;
                        updateConnectionStatus();
                    }, 3000); // 3秒超时
                }
            }, 5000); // 每5秒发送一次心跳
        }
        
        // 停止心跳检测
        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
            if (heartbeatTimeout) {
                clearTimeout(heartbeatTimeout);
                heartbeatTimeout = null;
            }
        }
        
        function updateConnectionStatus() {
            const statusEl = document.getElementById('connection-status');
            if (isPlayPageConnected) {
                statusEl.className = 'connection-status connected';
                statusEl.innerHTML = '<i class="bi bi-wifi"></i> 已连接';
            } else {
                statusEl.className = 'connection-status disconnected';
                statusEl.innerHTML = '<i class="bi bi-wifi-off"></i> 未连接';
            }
        }
        
        function handleServerMessage(data) {
            switch(data.type) {
                case 'connected':
                    console.log("遥控器连接确认:", data.message);
                    break;
                case 'pong':
                    // 收到pong响应，表示播放页面连接正常
                    isPlayPageConnected = true;
                    updateConnectionStatus();
                    if (heartbeatTimeout) {
                        clearTimeout(heartbeatTimeout);
                        heartbeatTimeout = null;
                    }
                    break;
                case 'playback_status':
                    updatePlaybackStatus(data.status);
                    break;
                case 'position_update':
                    updateProgress(data.currentTime, data.duration);
                    break;
                case 'volume_update':
                    if (data.hasOwnProperty('value')) {
                        // 单个音量更新
                        document.getElementById('volume-slider').value = Math.round(data.value * 100);
                    } else if (data.hasOwnProperty('audio1') && data.hasOwnProperty('audio2')) {
                        // 双音量更新，取平均值
                        const avgVolume = (data.audio1 + data.audio2) / 2;
                        document.getElementById('volume-slider').value = Math.round(avgVolume * 100);
                    }
                    // 添加独立音量更新处理
                    if (data.hasOwnProperty('audio1')) {
                        audio1Volume = data.audio1;
                        document.getElementById('audio1-volume-slider').value = Math.round(data.audio1 * 100);
                    }
                    if (data.hasOwnProperty('audio2')) {
                        audio2Volume = data.audio2;
                        document.getElementById('audio2-volume-slider').value = Math.round(data.audio2 * 100);
                    }
                    break;
                // 添加处理音频校准消息
                case 'audio_calibrated':
                    lastCalibrationTime = new Date();
                    document.getElementById('remote-last-calibration').textContent = lastCalibrationTime.toLocaleTimeString();
                    // 显示校准完成提示
                    const calibrationAlert = document.createElement('div');
                    calibrationAlert.className = 'alert alert-success alert-dismissible fade show position-fixed';
                    calibrationAlert.style = 'top: 10px; right: 10px; z-index: 1000;';
                    calibrationAlert.role = 'alert';
                    calibrationAlert.innerHTML = '音频已校准!';
                    document.body.appendChild(calibrationAlert);
                    
                    // 3秒后自动消失
                    setTimeout(() => {
                        if (calibrationAlert.parentNode) {
                            calibrationAlert.parentNode.removeChild(calibrationAlert);
                        }
                    }, 3000);
                    break;
                // 添加处理同步状态消息
                case 'sync_status':
                    const syncStatusEl = document.getElementById('remote-sync-status');
                    if (data.status === 'sync') {
                        syncStatusEl.textContent = '同步正常';
                        syncStatusEl.className = 'text-success';
                    } else {
                        syncStatusEl.textContent = '不同步 (' + data.diff.toFixed(3) + 's)';
                        syncStatusEl.className = 'text-danger';
                    }
                    syncStatus = data.status;
                    break;
                case 'song_changed':
                    // 重置歌曲相关信息
                    document.getElementById('song-title').textContent = data.song_name;
                    document.getElementById('artist').textContent = data.artist || '-';
                    currentSong.title = data.song_name;
                    currentSong.artist = data.artist || '-';
                    
                    // 重置进度条和时间显示
                    document.getElementById('progress-bar').style.width = '0%';
                    document.getElementById('progress-slider').value = 0;
                    document.getElementById('current-time').textContent = '00:00';
                    
                    // 更新歌曲时长信息
                    if (data.duration) {
                        currentSong.duration = data.duration;
                        document.getElementById('duration').textContent = formatTime(data.duration);
                        // 更新进度条的最大值
                        document.getElementById('progress-slider').max = data.duration;
                    }
                    break;
                case 'session_id':
                    // 当收到session_id时，表示连接已建立
                    isConnected = true;
                    updateConnectionStatus();
                    break;
                // 添加处理当前歌曲信息的case
                case 'current_song':
                    if (data.song) {
                        document.getElementById('song-title').textContent = data.song.name;
                        document.getElementById('artist').textContent = data.song.artist || '-';
                        currentSong.title = data.song.name;
                        currentSong.artist = data.song.artist || '-';
                        
                        // 如果有歌曲时长信息
                        if (data.song.duration) {
                            currentSong.duration = data.song.duration;
                            document.getElementById('duration').textContent = formatTime(data.song.duration);
                            // 更新进度条的最大值
                            document.getElementById('progress-slider').max = data.song.duration;
                        }
                    }
                    // 如果有当前播放位置信息
                    if (data.currentTime !== undefined && data.duration) {
                        updateProgress(data.currentTime, data.duration);
                    }
                    // 如果有音量信息
                    if (data.audio1 !== undefined && data.audio2 !== undefined) {
                        audio1Volume = data.audio1;
                        audio2Volume = data.audio2;
                        document.getElementById('audio1-volume-slider').value = Math.round(data.audio1 * 100);
                        document.getElementById('audio2-volume-slider').value = Math.round(data.audio2 * 100);
                        const avgVolume = (data.audio1 + data.audio2) / 2;
                        document.getElementById('volume-slider').value = Math.round(avgVolume * 100);
                    }
                    break;
                case 'error':
                    console.error("服务器错误:", data.message);
                    break;
            }
        }
        
        function updatePlaybackStatus(status) {
            const playPauseBtn = document.getElementById('play-pause-btn');
            const icon = playPauseBtn.querySelector('i');
            
            if (status === 'playing') {
                isPlaying = true;
                icon.className = 'bi bi-pause-fill';
            } else {
                isPlaying = false;
                icon.className = 'bi bi-play-fill';
            }
        }
        
        function updateProgress(currentTime, duration) {
            currentSong.currentTime = currentTime || 0;
            // 只有当duration有效且大于0时才更新歌曲总时长
            if (duration && duration > 0) {
                currentSong.duration = duration;
                document.getElementById('duration').textContent = formatTime(duration);
                // 更新进度条的最大值
                document.getElementById('progress-slider').max = duration;
            }
            
            const progressPercent = currentSong.duration > 0 ? (currentTime / currentSong.duration) * 100 : 0;
            document.getElementById('progress-bar').style.width = progressPercent + '%';
            document.getElementById('progress-slider').value = currentTime || 0; // 使用实际时间值而不是百分比
            
            document.getElementById('current-time').textContent = formatTime(currentTime || 0);
            // 确保持续更新时长显示
            if (currentSong.duration) {
                document.getElementById('duration').textContent = formatTime(currentSong.duration);
            }
        }
        
        function updateVolume(audio1, audio2) {
            // 使用两个音量的平均值作为显示音量
            const avgVolume = (audio1 + audio2) / 2;
            document.getElementById('volume-slider').value = Math.round(avgVolume * 100);
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        function sendCommand(command, data = {}) {
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                const message = {session_id: sessionId, command, ...data};
                ws.send(JSON.stringify(message));
            }
        }
        
        // 加载歌曲列表
        function loadSongList() {
            fetch('/api/songs')
                .then(response => response.json())
                .then(songs => {
                    const selector = document.getElementById('song-selector');
                    // 清空选项
                    selector.innerHTML = '<option value="">选择歌曲</option>';
                    // 添加歌曲选项
                    songs.forEach(song => {
                        const option = document.createElement('option');
                        option.value = song.name;
                        option.textContent = song.name;
                        selector.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('加载歌曲列表失败:', error);
                });
        }
        
        // 绑定事件
        document.addEventListener('DOMContentLoaded', function() {
            // 播放/暂停按钮
            document.getElementById('play-pause-btn').addEventListener('click', function() {
                if (isPlaying) {
                    sendCommand('pause');
                } else {
                    sendCommand('play');
                }
            });
            
            // 音量加按钮
            document.getElementById('vol-up-btn').addEventListener('click', function() {
                sendCommand('volume_up');
            });
            
            // 音量减按钮
            document.getElementById('vol-down-btn').addEventListener('click', function() {
                sendCommand('volume_down');
            });
            
            // 添加校准按钮事件
            document.getElementById('calibrate-btn').addEventListener('click', function() {
                sendCommand('calibrate_audio');
            });
            
            // 清空播放列表按钮
            document.getElementById('clear-playlist-btn').addEventListener('click', function() {
                if (confirm('确定要清空播放列表吗？')) {
                    clearPlaylist();
                }
            });
            
            // 音量滑块
            document.getElementById('volume-slider').addEventListener('input', function(e) {
                const volume = parseInt(e.target.value) / 100;
                sendCommand('set_volume', {target: 'both', value: volume});
            });
            
            // 添加独立音量滑块事件监听
            let audio1VolumeTimeout = null;
            document.getElementById('audio1-volume-slider').addEventListener('input', function(e) {
                const volume = parseInt(e.target.value) / 100;
                // 清除之前的定时器
                if (audio1VolumeTimeout) {
                    clearTimeout(audio1VolumeTimeout);
                }
                // 设置新的定时器，延迟发送命令
                audio1VolumeTimeout = setTimeout(() => {
                    sendCommand('set_volume', {target: 'audio1', value: volume});
                }, 100); // 100ms防抖延迟
            });
            
            let audio2VolumeTimeout = null;
            document.getElementById('audio2-volume-slider').addEventListener('input', function(e) {
                const volume = parseInt(e.target.value) / 100;
                // 清除之前的定时器
                if (audio2VolumeTimeout) {
                    clearTimeout(audio2VolumeTimeout);
                }
                // 设置新的定时器，延迟发送命令
                audio2VolumeTimeout = setTimeout(() => {
                    sendCommand('set_volume', {target: 'audio2', value: volume});
                }, 100); // 100ms防抖延迟
            });
            
            // 进度滑块
            document.getElementById('progress-slider').addEventListener('input', function(e) {
                const seekTime = parseInt(e.target.value); // 直接使用时间值
                sendCommand('seek', {value: seekTime});
            });
            
            // 歌曲选择器
            document.getElementById('song-selector').addEventListener('change', function(e) {
                const songName = e.target.value;
                if (songName) {
                    sendCommand('change_song', {song_name: songName});
                    // 清空选择器的值，避免重复选择同一首歌
                    e.target.value = '';
                    
                    // 重置进度和状态
                    document.getElementById('progress-bar').style.width = '0%';
                    document.getElementById('progress-slider').value = 0;
                    document.getElementById('current-time').textContent = '00:00';
                    document.getElementById('duration').textContent = '00:00';
                }
            });
            
            // 连接WebSocket
            connectWebSocket();
        });
    </script>
</body>
</html>
