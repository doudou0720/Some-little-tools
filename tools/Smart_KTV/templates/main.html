<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>歌词同步</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bootstrap.min.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bootstrap-icons.min.css') }}" />
    <script src="{{ url_for('static',filename='js/bootstrap.bundle.js') }}"></script>
    <style>
        body {
            background-size: 60% 100%;
            padding-top: 56px;
            /* 为固定顶部导航栏留出空间 */
            padding-bottom: 120px;
            /* 减小底部空间，从180px改为120px */
        }

        * {
            margin: 0 auto;
            padding: 0;
        }

        .play {
            color: #01e5ff;
            font-size: 24px;
        }

        .overPlay {
            font-size: inherit;
            color: #c9c9c9;
        }

        #div_lrc {
            position: absolute;
            padding-top: 0px;
            left: 28%;
            top: 0;
            width: 50%;
            transition: top 0.5s ease;
            margin: 0 auto;
            /* 删除transform以避免垂直居中 */
        }

        .div_DisLrc {
            overflow: hidden;
            color: #b1abab;
            height: 600px;
            position: relative;
            margin: 0 auto;
            display: flex;
            align-items: center;
        }

        /* 添加媒体查询以优化小屏幕显示 */
        @media (max-width: 768px) {
            #div_lrc {
                left: 5%;
                width: 90%;
            }

            .div_DisLrc {
                height: 400px;
            }
        }

        #audio {
            width: 100%;
        }

        .div_audio {
            width: 50%;
            margin: 0 auto;
        }

        .div_but {
            position: absolute;
            font-size: 26px;
            font-weight: 900;
            top: 40%;
            right: 0%;
        }

        .div_but p {
            cursor: pointer;
        }

        .card {
            transition: top 0.3s, display 0.5s;
        }

        /* 添加卡片旋转动画 */
        @keyframes cardRotate {
            0% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(3deg);
            }

            100% {
                transform: rotate(-5deg);
            }
        }

        #ShowInfo {
            animation: cardRotate 8s infinite ease-in-out;
            transform-origin: center center;
            transition: transform 0.3s ease, height 0.3s ease;
            overflow: hidden;
        }

        #ShowInfo:hover {
            animation: none;
            transform: rotate(0deg);
        }

        #ShowInfo.expanded {
            animation: none;
            transform: rotate(0deg);
        }

        #CardText {
            transition: all 0.3s ease;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

        #CardText.show {
            max-height: 200px;
            opacity: 1;
        }

        /* 优化卡片容器布局 */
        .card-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 300px;
            margin-top: 20px;
        }

        #waveform {
            width: 100%;
            height: 200px;
            background-color: #fff;
        }

        .volume-control {
            margin: 5px 0;
            /* 减小音量控制的外边距 */
        }

        .volume-control label {
            font-size: 14px;
            /* 减小标签字体 */
            margin-bottom: 2px;
        }

        .volume-control input {
            padding: 3px;
            /* 减小输入框内边距 */
        }

        .volume-control span {
            font-size: 12px;
            /* 减小数值字体 */
        }

        /* 添加播放控制按钮样式 */
        .playback-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            /* 减小按钮间距 */
            margin: 5px 0;
            /* 减小外边距 */
        }

        .playback-btn {
            font-size: 20px;
            /* 稍微减小按钮字体 */
            background: none;
            border: none;
            cursor: pointer;
            color: #007bff;
            width: 40px;
            /* 设置固定宽度 */
            height: 40px;
            /* 设置固定高度 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 调整进度条容器样式 */
        .progress-container {
            width: 100%;
            margin: 5px 0;
            /* 减小外边距 */
        }

        /* 确保Bootstrap进度条正确显示，从左侧开始填充 */
        .progress {
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 0.1s;
            left: 0;
            position: absolute;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            /* 减小时间显示字体 */
            color: #666;
            margin-top: 2px;
        }

        /* 添加进度滑块样式 */
        .progress-slider {
            width: 100%;
            margin: 15px 0;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #ddd;
            outline: none;
        }

        .progress-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
            box-shadow: 0 0 5px 0 rgba(0, 0, 0, 0.5);
        }

        .progress-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #007bff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 5px 0 rgba(0, 0, 0, 0.5);
        }

        /* 添加二维码模态框样式 */
        .qr-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .qr-modal-content {
            background-color: #fff;
            color: #000;
            margin: 15% auto;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .qr-code-container {
            margin: 15px 0;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: black;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .div_DisLrc {
                height: 400px;
                /* 在小屏幕上减小歌词显示区域高度 */
            }

            #div_lrc {
                left: 5%;
                /* 在小屏幕上调整歌词位置 */
                width: 90%;
                /* 在小屏幕上调整歌词宽度 */
                top: 200px;
                /* 在小屏幕上调整歌词顶部位置 */
            }

            #waveform {
                height: 150px;
                /* 在小屏幕上减小波形图高度 */
            }

            .container-fluid {
                padding: 0 10px;
                /* 在小屏幕上减小容器内边距 */
            }

            .col-5 {
                flex: 0 0 100%;
                max-width: 100%;
            }

            .col-7 {
                flex: 0 0 100%;
                max-width: 100%;
            }

            /* 调整底部控制栏在小屏幕上的显示 */
            .fixed-bottom {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 10px;
            }

            .volume-control label {
                font-size: 14px;
            }

            .qr-modal-content {
                width: 90%;
                /* 在小屏幕上调整模态框宽度 */
            }
        }

        @media (max-height: 700px) {
            .div_DisLrc {
                height: 400px;
                /* 在低屏幕高度设备上减小歌词显示区域高度 */
            }

            #waveform {
                height: 150px;
                /* 在低屏幕高度设备上减小波形图高度 */
            }
        }
    </style>
</head>



<body>
    <script>
        // 添加WebSocket连接相关代码
        let ws = null;
        let isRemoteConnected = false;
        // 使用从模板传递的session_id
        let sessionId = "{{ session_id }}";
        // 添加心跳相关变量
        let heartbeatInterval = null;
        // 添加lastSentTime变量定义
        let lastSentTime = 0;

        function connectWebSocket() {
            try {
                // 修改WebSocket连接URL，使用路径参数传递session_id
                ws = new WebSocket(`ws://${window.location.host}/websocket/${sessionId}`);

                ws.onopen = function (event) {
                    console.log("WebSocket连接已建立");
                    isRemoteConnected = true;
                    updateRemoteStatus();
                    // 连接成功后主动发送状态请求
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'get_status' }));
                        ws.send(JSON.stringify({ type: 'get_volume' }));
                        // 发送当前歌曲信息
                        setTimeout(() => {
                            if (ws && ws.readyState === WebSocket.OPEN) {
                                ws.send(JSON.stringify({
                                    type: 'song_changed',
                                    song_name: "{{ song_name }}",
                                    artist: "{{ singer }}",
                                    duration: getDuration(1)
                                }));
                            }
                        }, 100);
                    }
                    // 启动心跳
                    startHeartbeat();
                };

                ws.onmessage = function (event) {
                    try {
                        const data = JSON.parse(event.data);
                        handleRemoteCommand(data);
                    } catch (e) {
                        console.error("处理远程命令出错:", e);
                    }
                };

                ws.onclose = function (event) {
                    console.log("WebSocket连接已关闭");
                    isRemoteConnected = false;
                    updateRemoteStatus();
                    stopHeartbeat();
                    // 尝试重连
                    setTimeout(connectWebSocket, 3000);
                };

                ws.onerror = function (error) {
                    console.error("WebSocket错误:", error);
                };
            } catch (e) {
                console.error("WebSocket连接失败:", e);
            }
        }

        // 心跳机制
        function startHeartbeat() {
            stopHeartbeat();
            heartbeatInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, 5000); // 每5秒发送一次心跳
        }

        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }

        function updateRemoteStatus() {
            // 可以在这里更新遥控状态显示
        }

        function handleRemoteCommand(data) {
            switch (data.command) {
                case 'play':
                    if (!isPlaying) {
                        playAudioBoth();
                    }
                    // 确保向遥控器发送状态更新
                    if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                        ws.send(JSON.stringify({
                            type: 'playback_status',
                            status: 'playing'
                        }));
                    }
                    break;
                case 'pause':
                    if (isPlaying) {
                        pauseAudioBoth();
                    }
                    // 确保向遥控器发送状态更新
                    if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                        ws.send(JSON.stringify({
                            type: 'playback_status',
                            status: 'paused'
                        }));
                    }
                    break;
                case 'volume_up':
                    setVolume(1, Math.min(1.0, getVolume(1) + 0.1));
                    setVolume(2, Math.min(1.0, getVolume(2) + 0.1));
                    updateVolumeDisplay();
                    break;
                case 'volume_down':
                    setVolume(1, Math.max(0.0, getVolume(1) - 0.1));
                    setVolume(2, Math.max(0.0, getVolume(2) - 0.1));
                    updateVolumeDisplay();
                    break;
                case 'set_volume':
                    if (data.target === 'audio1' || data.target === 'both') {
                        setVolume(1, Math.max(0.0, Math.min(1.0, data.value)));
                    }
                    if (data.target === 'audio2' || data.target === 'both') {
                        setVolume(2, Math.max(0.0, Math.min(1.0, data.value)));
                    }
                    updateVolumeDisplay();
                    break;
                case 'seek':
                    if (data.value !== undefined) {
                        seekAudioBoth(data.value);
                        // 通知遥控器位置更新
                        if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                            ws.send(JSON.stringify({
                                type: 'position_update',
                                currentTime: getCurrentTime(1),
                                duration: getDuration(1)
                            }));
                        }
                    }
                    break;
                // 添加切歌处理
                case 'change_song':
                    if (data.song_name) {
                        window.location.href = `/play?name=${encodeURIComponent(data.song_name)}&session_id=${encodeURIComponent(sessionId)}`;
                    }
                    break;
                // 添加获取状态处理
                case 'get_status':
                    if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                        ws.send(JSON.stringify({
                            type: 'playback_status',
                            status: isPlaying ? 'playing' : 'paused'
                        }));
                        ws.send(JSON.stringify({
                            type: 'position_update',
                            currentTime: getCurrentTime(1),
                            duration: getDuration(1)
                        }));
                    }
                    break;
                // 添加获取音量处理
                case 'get_volume':
                    updateVolumeDisplay();
                    break;
                // 添加心跳响应
                case 'ping':
                    if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                        ws.send(JSON.stringify({ type: 'pong' }));
                    }
                    break;
            }

            // 处理服务器消息类型
            switch (data.type) {
                case 'session_id':
                    // 处理session_id
                    break;
                case 'playback_status':
                    // 处理播放状态
                    break;
                case 'volume_update':
                    // 处理音量更新
                    break;
                case 'position_update':
                    // 处理位置更新
                    break;
            }
        }

        function updateVolumeDisplay() {
            document.getElementById('audio1-volume').value = getVolume(1);
            document.getElementById('audio2-volume').value = getVolume(2);
            document.getElementById('audio1-volume-value').textContent = Math.round(getVolume(1) * 100) + '%';
            document.getElementById('audio2-volume-value').textContent = Math.round(getVolume(2) * 100) + '%';

            // 发送音量更新到遥控器
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'volume_update',
                    audio1: getVolume(1),
                    audio2: getVolume(2)
                }));
            }
        }

        function showText() {
            // 鼠标悬停时快速回到0度并展开信息
            const card = document.getElementById("ShowInfo");
            const cardText = document.getElementById("CardText");

            card.style.animation = "none";
            card.style.transform = "rotate(0deg)";

            // 使用CSS类控制展开动画
            cardText.classList.add("show");
            cardText.style.display = "block";

            ChangeCard();
        }

        function hideText() {
            // 鼠标离开时恢复动画
            const card = document.getElementById("ShowInfo");
            const cardText = document.getElementById("CardText");

            // 使用CSS类控制折叠动画
            cardText.classList.remove("show");

            // 在过渡完成后恢复动画
            setTimeout(() => {
                // 只有在非展开状态下才恢复动画
                if (!card.classList.contains("expanded")) {
                    card.style.animation = "";
                    // 添加回到初始旋转位置的过渡效果
                    card.style.transform = "";
                }
                // 使用display: none避免白框
                if (!cardText.classList.contains("show")) {
                    cardText.style.display = "none";
                }
            }, 300);

            ChangeCard();
        }

        // 添加二维码相关函数
        function showQRCode() {
            if (!sessionId) {
                alert("尚未建立遥控器连接，请稍后重试");
                return;
            }

            const modal = document.getElementById("qr-modal");
            const qrCodeContainer = document.getElementById("qr-code-container");

            // 清空之前的二维码
            qrCodeContainer.innerHTML = "";

            // 生成二维码
            const remoteUrl = `${window.location.origin}/remote?session_id=${sessionId}`;

            // 使用本地qrcode.js库生成二维码
            const qrCode = new QRCode(qrCodeContainer, {
                text: remoteUrl,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            modal.style.display = "block";
        }

        function closeQRCode() {
            document.getElementById("qr-modal").style.display = "none";
        }

        // 添加音频同步校准相关函数
        function initWebAudio() {
            try {
                // 修复audioContext重复定义问题
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                // 创建增益节点用于音量控制
                audio1Gain = audioContext.createGain();
                audio2Gain = audioContext.createGain();
                
                // 连接增益节点到输出
                audio1Gain.connect(audioContext.destination);
                audio2Gain.connect(audioContext.destination);
                
                // 加载音频文件
                loadAudioFile("{{ url_for('static',filename='audios/'+name_ins) }}", 1);
                loadAudioFile("{{ url_for('static',filename='audios/'+name_vol) }}", 2);
                
                console.log("Web Audio API 初始化成功");
            } catch (e) {
                console.error("Web Audio API 初始化失败:", e);
            }
        }
        
        // 检查音频是否加载完成并更新按钮状态
        function checkAudioLoadedAndUpdateButton() {
            const syncBtn = document.getElementById('sync-btn');
            const syncBtnText = document.getElementById('sync-btn-text');
            const syncBtnSpinner = document.getElementById('sync-btn-spinner');
            const playBtn = document.getElementById('play-btn');
            const playBtnSpinner = document.getElementById('play-btn-spinner');
            
            if (audio1Buffer && audio2Buffer) {
                // 音频加载完成，启用按钮
                syncBtn.disabled = false;
                syncBtnText.textContent = '音频同步';
                syncBtnSpinner.style.display = 'none';
                
                // 同时启用播放按钮
                playBtn.disabled = false;
                playBtnSpinner.style.display = 'none';
            } else {
                // 音频仍在加载中，禁用按钮并显示加载状态
                syncBtn.disabled = true;
                syncBtnText.textContent = '音频加载中';
                syncBtnSpinner.style.display = 'inline-block';
                
                // 同时禁用播放按钮并显示加载状态
                playBtn.disabled = true;
                playBtnSpinner.style.display = 'inline-block';
            }
        }
        
        // 加载音频文件
        function loadAudioFile(url, audioNum) {
            var request = new XMLHttpRequest();
            request.open('GET', url, true);
            request.responseType = 'arraybuffer';
            
            request.onload = function() {
                audioContext.decodeAudioData(request.response, function(buffer) {
                    if (audioNum === 1) {
                        audio1Buffer = buffer;
                    } else {
                        audio2Buffer = buffer;
                    }
                    console.log("音频文件 " + audioNum + " 加载完成");
                    // 检查音频加载状态并更新按钮
                    checkAudioLoadedAndUpdateButton();
                }, function(e) {
                    console.error("音频解码失败:", e);
                });
            }
            
            request.onerror = function() {
                console.error("音频文件加载失败");
            }
            
            request.send();
        }

        function calibrateAudio() {
            document.getElementById('calibration-status').textContent = '校准中';
            // 记录当前时间作为校准点
            const calibrateTime = getCurrentTime(1);
            seekAudioBoth(calibrateTime);

            // 发送校准完成消息到遥控器
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'audio_calibrated',
                    time: calibrateTime
                }));
            }

            // 更新校准状态显示
            document.getElementById('calibration-status').textContent = '已校准';
            document.getElementById('last-calibration').textContent = new Date().toLocaleTimeString();
        }

        // 添加立即检查同步的函数
        function checkAudioSyncNow() {
            // 更新显示为检查中状态
            const popover = document.querySelector('[data-bs-toggle="popover"]');
            if (popover) {
                const popoverInstance = bootstrap.Popover.getInstance(popover);
                if (popoverInstance) {
                    // 更新popover配置中的内容为检查中状态
                    const content = `
                        <div>
                            <p class="card-text mb-1">
                                状态: <span id="sync-status" class="text-primary">检查中</span>
                            </p>
                            <p class="card-text mb-1">
                                上次检查: <span id="last-check">${new Date().toLocaleTimeString()}</span>
                            </p>
                            <button class="btn btn-primary btn-sm mt-2" onclick="checkAudioSyncNow()">检查同步</button>
                        </div>
                    `;
                    popoverInstance._config.content = content;
                    
                    // 如果popover当前是显示状态，需要更新显示内容
                    if (popoverInstance.tip) {
                        const contentElement = popoverInstance.tip.querySelector('.popover-body');
                        if (contentElement) {
                            contentElement.innerHTML = content;
                        }
                    }
                }
            }

            // 发送校准完成消息到遥控器
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'audio_checked',
                    time: new Date().toLocaleTimeString()
                }));
            }

            // 立即执行一次同步检查
            setTimeout(checkAudioSync, 100);
        }

        // 定期检查音频同步状态
        function checkAudioSync() {
            const timeDiff = Math.abs(getCurrentTime(1) - getCurrentTime(2));
            
            // 发送同步状态到遥控器
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'sync_status',
                    diff: timeDiff,
                    status: timeDiff > 0.1 ? 'desync' : 'sync'
                }));
            }
            
            // 更新popover中的状态显示
            const popover = document.querySelector('[data-bs-toggle="popover"]');
            if (popover) {
                // 先确保popover已显示，再更新内容
                const popoverInstance = bootstrap.Popover.getInstance(popover);
                if (popoverInstance) {
                    // 直接更新popover配置中的内容
                    const content = `
                        <div>
                            <p class="card-text mb-1">
                                状态: <span id="sync-status" class="${timeDiff > 0.1 ? 'text-danger' : 'text-success'}">${timeDiff > 0.1 ? '不同步 (' + timeDiff.toFixed(3) + 's)' : '同步正常'}</span>
                            </p>
                            <p class="card-text mb-1">
                                上次检查: <span id="last-check">${new Date().toLocaleTimeString()}</span>
                            </p>
                            <button class="btn btn-primary btn-sm mt-2" onclick="checkAudioSyncNow()">检查同步</button>
                        </div>
                    `;
                    popoverInstance._config.content = content;
                    
                    // 如果popover当前是显示状态，需要更新显示内容
                    if (popoverInstance.tip) {
                        const contentElement = popoverInstance.tip.querySelector('.popover-body');
                        if (contentElement) {
                            contentElement.innerHTML = content;
                        }
                    }
                }
            }
        }

        // 添加播放控制函数
        function togglePlay() {
            if (isPlaying) {
                pauseAudioBoth();
            } else {
                playAudioBoth();
            }
        }

        function playAudioBoth() {
            playAudio(1, false); // 播放但不立即更新状态
            playAudio(2, false); // 播放但不立即更新状态
            isPlaying = true;
            updatePlayButton();
        }

        function pauseAudioBoth() {
            pauseAudio(1, false); // 暂停但不更新状态
            pauseAudio(2, false); // 暂停但不更新状态
            isPlaying = false;
            updatePlayButton();
        }

        function updatePlayButton() {
            const playBtn = document.getElementById('play-btn');
            const icon = playBtn.querySelector('i');
            const spinner = document.getElementById('play-btn-spinner');

            if (isPlaying) {
                icon.className = 'bi bi-pause-fill';
            } else {
                icon.className = 'bi bi-play-fill';
            }

            // 确保播放按钮启用时隐藏spinner
            if (!playBtn.disabled) {
                spinner.style.display = 'none';
            }

            // 通知遥控器播放状态更新
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'playback_status',
                    status: isPlaying ? 'playing' : 'paused'
                }));
            }
        }
    </script>

    <script src="{{ url_for('static',filename='js/jquery-3.6.1.js') }}"></script>
    <script>
        var play = $("#lrc_row1");
        var ms = 0;
        var is_controled = false;
        var syncTimeout = null;

        // 添加播放状态变量
        var isPlaying = false;

        // 添加Web Audio API相关变量
        var audioContext;
        var audio1Source, audio2Source;
        var audio1Buffer, audio2Buffer;
        var audio1Gain, audio2Gain;
        var audio1StartTime = 0, audio2StartTime = 0;
        var audio1PauseTime = 0, audio2PauseTime = 0;
        var audio1IsPlaying = false, audio2IsPlaying = false;

        // 获取音量的函数
        function getVolume(audioNum) {
            if (audioNum === 1 && audio1Gain) {
                return audio1Gain.gain.value;
            } else if (audioNum === 2 && audio2Gain) {
                return audio2Gain.gain.value;
            }
            return 1.0;
        }

        // 初始化Web Audio API
        function initWebAudio() {
            try {
                // 修复audioContext重复定义问题
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                // 创建增益节点用于音量控制
                audio1Gain = audioContext.createGain();
                audio2Gain = audioContext.createGain();
                
                // 连接增益节点到输出
                audio1Gain.connect(audioContext.destination);
                audio2Gain.connect(audioContext.destination);
                
                // 加载音频文件
                loadAudioFile("{{ url_for('static',filename='audios/'+name_ins) }}", 1);
                loadAudioFile("{{ url_for('static',filename='audios/'+name_vol) }}", 2);
                
                console.log("Web Audio API 初始化成功");
            } catch (e) {
                console.error("Web Audio API 初始化失败:", e);
            }
        }
        
        // 检查音频是否加载完成并更新按钮状态
        function checkAudioLoadedAndUpdateButton() {
            const syncBtn = document.getElementById('sync-btn');
            const syncBtnText = document.getElementById('sync-btn-text');
            const syncBtnSpinner = document.getElementById('sync-btn-spinner');
            const playBtn = document.getElementById('play-btn');
            const playBtnSpinner = document.getElementById('play-btn-spinner');
            
            if (audio1Buffer && audio2Buffer) {
                // 音频加载完成，启用按钮
                syncBtn.disabled = false;
                syncBtnText.textContent = '音频同步';
                syncBtnSpinner.style.display = 'none';
                
                // 同时启用播放按钮
                playBtn.disabled = false;
                playBtnSpinner.style.display = 'none';
            } else {
                // 音频仍在加载中，禁用按钮并显示加载状态
                syncBtn.disabled = true;
                syncBtnText.textContent = '音频加载中';
                syncBtnSpinner.style.display = 'inline-block';
                
                // 同时禁用播放按钮并显示加载状态
                playBtn.disabled = true;
                playBtnSpinner.style.display = 'inline-block';
            }
        }
        
        // 加载音频文件
        function loadAudioFile(url, audioNum) {
            var request = new XMLHttpRequest();
            request.open('GET', url, true);
            request.responseType = 'arraybuffer';
            
            request.onload = function() {
                audioContext.decodeAudioData(request.response, function(buffer) {
                    if (audioNum === 1) {
                        audio1Buffer = buffer;
                    } else {
                        audio2Buffer = buffer;
                    }
                    console.log("音频文件 " + audioNum + " 加载完成");
                    // 检查音频加载状态并更新按钮
                    checkAudioLoadedAndUpdateButton();
                }, function(e) {
                    console.error("音频解码失败:", e);
                });
            }
            
            request.onerror = function() {
                console.error("音频文件加载失败");
            }
            
            request.send();
        }

        // 播放音频
        function playAudio(audioNum, updateState = true) {
            if (!audioContext) return;

            // 恢复音频上下文（如果被挂起）
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            if (audioNum === 1 && audio1Buffer) {
                // 如果source存在，则先暂停再播放以确保同步
                if (audio1IsPlaying) {
                    pauseAudio(1, false); // 暂停但不更新播放状态
                } else if (audio1Source) {
                    // 如果有source但未播放，先停止它
                    try {
                        audio1Source.stop();
                    } catch (e) {
                        // 忽略错误
                    }
                }
                // 重新创建source确保同步
                audio1Source = audioContext.createBufferSource();
                audio1Source.buffer = audio1Buffer;
                audio1Source.connect(audio1Gain);
                audio1Source.onended = function () {
                    audio1IsPlaying = false;
                    if (updateState) {
                        updatePlayButton();
                    }
                    // 通知遥控器播放状态
                    if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                        ws.send(JSON.stringify({ type: 'playback_status', status: 'paused' }));
                    }
                };

                audio1Source.start(0, audio1PauseTime);
                audio1StartTime = audioContext.currentTime - audio1PauseTime;
                audio1IsPlaying = true;

                // 通知遥控器播放状态
                if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                    ws.send(JSON.stringify({ type: 'playback_status', status: 'playing' }));
                }
            } else if (audioNum === 2 && audio2Buffer) {
                // 如果source存在，则先暂停再播放以确保同步
                if (audio2IsPlaying) {
                    pauseAudio(2, false); // 暂停但不更新播放状态
                } else if (audio2Source) {
                    // 如果有source但未播放，先停止它
                    try {
                        audio2Source.stop();
                    } catch (e) {
                        // 忽略错误
                    }
                }
                // 重新创建source确保同步
                audio2Source = audioContext.createBufferSource();
                audio2Source.buffer = audio2Buffer;
                audio2Source.connect(audio2Gain);
                audio2Source.onended = function () {
                    audio2IsPlaying = false;
                    if (updateState) {
                        updatePlayButton();
                    }
                    // 通知遥控器播放状态
                    if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                        ws.send(JSON.stringify({ type: 'playback_status', status: 'paused' }));
                    }
                };

                audio2Source.start(0, audio2PauseTime);
                audio2StartTime = audioContext.currentTime - audio2PauseTime;
                audio2IsPlaying = true;
            }
        }

        // 暂停音频
        function pauseAudio(audioNum, updateState = true) {
            if (audioNum === 1 && audio1IsPlaying) {
                // 记录暂停时间
                audio1PauseTime = audioContext.currentTime - audio1StartTime;
                // 停止音频播放
                if (audio1Source) {
                    audio1Source.stop();
                }
                audio1IsPlaying = false;

                // 通知遥控器暂停状态
                if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                    ws.send(JSON.stringify({ type: 'playback_status', status: 'paused' }));
                }
            } else if (audioNum === 2 && audio2IsPlaying) {
                // 记录暂停时间
                audio2PauseTime = audioContext.currentTime - audio2StartTime;
                // 停止音频播放
                if (audio2Source) {
                    audio2Source.stop();
                }
                audio2IsPlaying = false;

                // 通知遥控器暂停状态
                if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                    ws.send(JSON.stringify({ type: 'playback_status', status: 'paused' }));
                }
            }

            // 只有在需要更新状态时才更新全局播放状态
            if (updateState) {
                // 检查是否所有音频都已暂停，如果是则更新全局播放状态
                if (!audio1IsPlaying && !audio2IsPlaying) {
                    isPlaying = false;
                    updatePlayButton();
                }
            }
        }

        // 设置音频当前播放位置
        function seekAudio(audioNum, time) {
            if (audioNum === 1) {
                // 停止当前播放（如果正在播放）
                if (audio1Source) {
                    try {
                        audio1Source.stop();
                    } catch (e) {
                        // 忽略错误
                    }
                }
                audio1PauseTime = time;
            } else {
                // 停止当前播放（如果正在播放）
                if (audio2Source) {
                    try {
                        audio2Source.stop();
                    } catch (e) {
                        // 忽略错误
                    }
                }
                audio2PauseTime = time;
            }
        }

        // 同时设置两个音频的播放位置
        function seekAudioBoth(time) {
            // 保存当前播放状态
            const wasPlaying = isPlaying;

            // 如果正在播放，则先暂停
            if (wasPlaying) {
                pauseAudioBoth();
            }

            // 设置新的播放位置
            seekAudio(1, time);
            seekAudio(2, time);

            // 恢复之前的播放状态
            if (wasPlaying) {
                // 使用setTimeout确保暂停完全执行后再恢复播放
                setTimeout(() => {
                    playAudioBoth();
                }, 50);
            }

            // 更新进度条显示
            updateProgress();

            // 通知遥控器位置更新
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'position_update',
                    currentTime: time,
                    duration: getDuration(1)
                }));
                // 更新lastSentTime以避免重复发送
                lastSentTime = time;
            }
        }

        // 获取音频当前播放时间
        function getCurrentTime(audioNum) {
            if (audioNum === 1) {
                if (audio1IsPlaying) {
                    return audioContext.currentTime - audio1StartTime;
                } else {
                    return audio1PauseTime;
                }
            } else {
                if (audio2IsPlaying) {
                    return audioContext.currentTime - audio2StartTime;
                } else {
                    return audio2PauseTime;
                }
            }
        }

        // 获取音频总时长
        function getDuration(audioNum) {
            if (audioNum === 1 && audio1Buffer) {
                return audio1Buffer.duration;
            } else if (audioNum === 2 && audio2Buffer) {
                return audio2Buffer.duration;
            }
            return 0;
        }

        // 设置音量
        function setVolume(audioNum, volume) {
            if (audioNum === 1 && audio1Gain) {
                audio1Gain.gain.value = volume;
            } else if (audioNum === 2 && audio2Gain) {
                audio2Gain.gain.value = volume;
            }
        }

        // 格式化时间显示
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // 更新进度条显示
        function updateProgress() {
            const currentTime = getCurrentTime(1);
            const duration = getDuration(1);

            if (duration > 0) {
                const progressPercent = (currentTime / duration) * 100;
                document.getElementById('progress-fill').style.width = progressPercent + '%';
                document.getElementById('current-time').textContent = formatTime(currentTime);
                document.getElementById('duration').textContent = formatTime(duration);

                // 定期向遥控器发送位置更新
                if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                    // 每秒发送一次位置更新
                    if (Math.floor(currentTime) !== Math.floor(lastSentTime || 0)) {
                        ws.send(JSON.stringify({
                            type: 'position_update',
                            currentTime: currentTime,
                            duration: duration
                        }));
                        lastSentTime = currentTime;
                    }
                }
            }
        }

        // 点击进度条跳转到指定位置
        function seekTo(event) {
            const progressBar = document.getElementById('progress-bar');
            const rect = progressBar.getBoundingClientRect();
            const pos = (event.clientX - rect.left) / rect.width;
            const duration = getDuration(1);
            const seekTime = pos * duration;

            seekAudioBoth(seekTime);
        }

        // 音量控制
        document.getElementById('audio1-volume').addEventListener('input', function (e) {
            var volume = parseFloat(e.target.value);
            setVolume(1, volume); // 使用Web Audio API设置音量
            document.getElementById('audio1-volume-value').textContent = Math.round(volume * 100) + '%';
            updateVolumeDisplay();
        });

        document.getElementById('audio2-volume').addEventListener('input', function (e) {
            var volume = parseFloat(e.target.value);
            setVolume(2, volume); // 使用Web Audio API设置音量
            document.getElementById('audio2-volume-value').textContent = Math.round(volume * 100) + '%';
            updateVolumeDisplay();
        });

        // 使用Promise改进歌词加载
        function LoadLrc() {
            return new Promise(function (resolve, reject) {
                // 加载歌词
                $('#div_1').load("{{ url_for('static',filename='audios/'+name_lrc) }}", function (response, status, xhr) {
                    if (status == "error") {
                        reject("加载歌词失败: " + xhr.status + " " + xhr.statusText);
                        return;
                    }

                    // 获取所有歌词
                    setTimeout(function () {
                        try {
                            var lrcArr = $("#div_1").text().split('\n');
                            // 清空之前的歌词
                            $("#div_lrc").empty();

                            // 添加初始行
                            var firstP = document.createElement("p");
                            firstP.id = "lrc_row1";
                            firstP.dataset.minute = "0";
                            firstP.dataset.second = "0";
                            firstP.dataset.millisecond = "0";
                            firstP.innerText = "";
                            $("#div_lrc").append(firstP);

                            for (var i = 0; i < lrcArr.length; i++) {
                                // 空白歌词不进行加载
                                if (lrcArr[i].substring(11) != "") {
                                    var p = document.createElement("p");
                                    var timeMatch = lrcArr[i].match(/\[(\d+):(\d+\.\d+)]/);
                                    if (timeMatch) {
                                        p.innerText = lrcArr[i].substring(timeMatch[0].length);
                                        p.dataset.minute = parseInt(timeMatch[1]);
                                        p.dataset.second = parseFloat(timeMatch[2]);
                                        // 提取毫秒部分
                                        var timeParts = timeMatch[2].split('.');
                                        if (timeParts.length > 1) {
                                            p.dataset.millisecond = parseInt(timeParts[1]);
                                        } else {
                                            p.dataset.millisecond = 0;
                                        }
                                        $("#div_lrc").append(p);
                                    }
                                }
                            }
                            play = $("#lrc_row1");
                            resolve();
                        } catch (e) {
                            reject("解析歌词出错: " + e.message);
                        }
                    }, 300); // 稍微增加延迟确保内容加载完成
                });
            });
        }

        $(document).ready(function () {
            LoadLrc().then(function () {
                console.log("歌词加载完成");
            }).catch(function (error) {
                console.error("歌词加载失败:", error);
            });

            // 页面加载完成后连接WebSocket
            connectWebSocket();

            // 初始化Web Audio API
            initWebAudio();

            // 启动音频同步检查定时器，每2秒检查一次
            setInterval(checkAudioSync, 500);

            // 添加URL重写，防止刷新导致的/remote失联
            if (sessionId && typeof history !== 'undefined' && history.pushState) {
                const newUrl = `${window.location.origin}/play?session_id=${sessionId}`;
                history.pushState({}, '', newUrl);
            }
        });

        function lrcDisplay() {
            // 使用第一个音频作为时间基准进行歌词同步

            // 获取播放进度(转换的格式为: 00:00)
            var currentTime = getCurrentTime(1); // 使用Web Audio API获取当前时间
            var minute = Math.floor(currentTime / 60); // 分钟
            var second = currentTime % 60; // 秒数
            var millisecond = (second - Math.floor(second)) * 1000; // 毫秒数

            // 查找当前应该显示的歌词
            var currentElement = $("#lrc_row1");
            $('#div_lrc > p').each(function () {
                var min = parseInt($(this).data('minute')) || 0;
                var sec = parseFloat($(this).data('second')) || 0;
                var ms = parseInt($(this).data('millisecond')) || 0;

                // 转换为总毫秒数进行比较
                var lyricTotalMs = min * 60 * 1000 + Math.floor(sec) * 1000 + ms;
                var currentTotalMs = minute * 60 * 1000 + Math.floor(second) * 1000 + millisecond;

                if (lyricTotalMs <= currentTotalMs) {
                    currentElement = $(this);
                } else {
                    return false; // 跳出循环
                }
            });

            // 更新高亮显示的歌词
            if (!currentElement.is(play)) {
                $('#div_lrc > p').removeClass('play overPlay');
                play = currentElement;
                play.addClass('play');

                // 将已播放的歌词标记为已播放
                play.prevAll().addClass('overPlay');

                // 歌词滚动到屏幕中央
                var container = $(".div_DisLrc");
                var containerHeight = container.height();
                var elementTop = play.position().top;
                var elementHeight = play.outerHeight(true);

                // 计算目标位置使当前歌词垂直居中
                var targetTop = (containerHeight / 2) - (elementTop + elementHeight / 2);

                // 实现先快后慢的动画效果
                var currentTop = parseInt($("#div_lrc").css("top")) || 0;
                var distance = targetTop - currentTop;

                // 如果距离较远，使用较快的速度；如果距离较近，使用较慢的速度
                var animationSpeed = Math.abs(distance) > 100 ? 300 : 500;

                // 应用位置调整，使用动画使滚动更平滑
                $("#div_lrc").animate({
                    top: targetTop + "px"
                }, animationSpeed);
            }

            // 当回到顶部时确保有过渡动画
            if (currentElement.is($("#lrc_row1")) && Math.abs(parseInt($("#div_lrc").css("top"))) > 1) {
                $("#div_lrc").animate({
                    top: "0px"
                }, 300);
            }
        }

        // 定时更新歌词显示和进度条
        setInterval(function () {
            lrcDisplay();
            updateProgress();
        }, 100);

        //歌词滚动(手动)
        function btn_top() {
            var top = parseInt($("#div_lrc").css("top"));
            // 限制最大位置，防止过度滚动
            var maxTop = 50; // 以百分比表示
            var newTop = Math.min(top + 30, maxTop + $("#div_lrc").height() / 2);
            $("#div_lrc").css("top", newTop + "px");
        }

        function btn_down() {
            var top = parseInt($("#div_lrc").css("top"));
            // 限制最小位置，防止过度滚动
            var minTop = 50; // 以百分比表示
            var newTop = Math.max(top - 30, minTop - $("#div_lrc").height() / 2);
            $("#div_lrc").css("top", newTop + "px");
        }

        //调整歌词位置的函数
        function btn_top() {
            var top = parseInt($("#div_lrc").css("top"));
            // 限制最大位置，防止过度滚动
            var maxTop = 50; // 以百分比表示
            var newTop = Math.min(top + 30, maxTop + $("#div_lrc").height() / 2);
            $("#div_lrc").css("top", newTop + "px");
        }
        /*
            1.歌词文件不能是默认编码(记事本文件和lrc文件默认为ANSI编码) 只需要改为 UTF-8或
者GB2312,否则乱码
            2.歌曲因为没有算毫秒差距,可能出现细微误差
            3.因为网页同源策略的原因,外部直接打开html文件只能用firefox访问,
               不能进行跨域访问,如果不使用文件读取可以在任意地方打开.
            4.因为ajax识别原因,会把空格当做分割内容,即歌词文件名不能有空格
            5.因为js对文件操作以及ajax请求存在诸多默认限制,若以类似方法在winfrom asp等中很
多问题都会得到解决.
            6.setTimeout()和setInterval()，在浏览器窗口非激活的状态下会停止工作或者以极慢的
速度工作。目前我已知就IE不会有这种问题。
        */
    </script>
    <script>
        const ChangeCard = () => {
            // 动态调整歌词显示区域高度
            adjustLyricArea();
            ms = 0;

            // 如果卡片处于展开状态，则保持展开样式
            const card = $("#ShowInfo");
            if (card.hasClass("expanded")) {
                card.addClass("expanded");
            }
        }

        // 添加点击展开/收起功能
        function toggleExpand() {
            const card = $("#ShowInfo");
            if (card.hasClass("expanded")) {
                // 收起状态：添加动画效果
                card.css({
                    'transition': 'transform 0.3s ease, height 0.3s ease',
                    'transform': 'rotate(0deg)'
                });
                // 延迟移除 expanded 类和隐藏文本，确保动画完成
                setTimeout(() => {
                    card.removeClass("expanded");
                    hideText();
                }, 300); // 与动画时间匹配
            } else {
                // 展开状态：添加动画效果
                card.css('transition', 'transform 0.3s ease, height 0.3s ease');
                card.addClass("expanded");
                showText();
            }
        }

        // 修改窗口大小时的处理
        window.addEventListener('resize', function () {
            // 如果卡片处于展开状态，则保持展开样式
            const card = $("#ShowInfo");
            if (card.hasClass("expanded")) {
                card.addClass("expanded");
            }
            cancalDebounce();
            // 调整canvas尺寸
            if (canvas) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
        });

        // 点击外部区域关闭展开卡片
        document.addEventListener('click', function (event) {
            const card = document.getElementById("ShowInfo");
            const cardText = document.getElementById("CardText");
            // 检查点击是否在卡片外部
            if (!card.contains(event.target) && card.classList.contains("expanded")) {
                card.classList.remove("expanded");
                cardText.classList.remove("show");

                // 在过渡完成后恢复动画
                setTimeout(() => {
                    card.style.animation = "";
                    card.style.transform = "";
                    // 使用display: none避免白框
                    cardText.style.display = "none";
                }, 300);
            }
        });
        // 动态调整歌词显示区域高度
        adjustLyricArea();
        ms = 0;

        // 动态调整歌词显示区域
        function adjustLyricArea() {
            var windowHeight = $(window).height();
            var topNavbarHeight = 56; // 顶部导航栏高度
            var bottomNavbarHeight = 180; // 底部控制栏高度（根据实际情况调整）

            // 计算可用高度
            var availableHeight = windowHeight - topNavbarHeight - bottomNavbarHeight;

            // 设置歌词显示区域高度
            $(".div_DisLrc").css("height", availableHeight * 0.6 + "px");

            // 设置波形图区域高度
            $("#waveform").parent().css("height", availableHeight * 0.4 + "px");
            $("#waveform").css("height", "100%");
        }

        const debounce = (fn, delay) => {
            let timer;
            return function () {
                if (timer) {
                    clearTimeout(timer);
                }
                timer = setTimeout(() => {
                    fn();
                }, delay);
            }
        };
        const cancalDebounce = debounce(ChangeCard, 200);

        window.addEventListener('resize', function () {
            cancalDebounce();
            // 调整canvas尺寸
            if (canvas) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
        });

        $(document).ready(function () {
            ChangeCard();
            adjustLyricArea();
        });
    </script>

    <!-- 波形图相关脚本 -->
    <script>
        // 波形图绘制相关变量
        let audioContextWaveform; // 重命名变量避免冲突
        let analyser2;
        let source2;
        let canvas, canvasCtx;
        let micStream;
        let isRecording = false;
        let isAudioContextInitialized = false;
        let animationFrameId;
        let micAnalyser;

        // 初始化波形图 - 改为在用户交互后初始化
        function initWaveform() {
            // 防止重复初始化
            if (isAudioContextInitialized) return;

            canvas = document.getElementById('waveform');
            canvasCtx = canvas.getContext('2d');

            // 设置canvas尺寸
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            // 初始化音频上下文
            try {
                // 使用独立的audioContext变量避免冲突
                audioContextWaveform = new (window.AudioContext || window.webkitAudioContext)();
                // 在用户手势后恢复音频上下文
                if (audioContextWaveform.state === 'suspended') {
                    audioContextWaveform.resume();
                }
            } catch (e) {
                console.error('Web Audio API is not supported in this browser', e);
                return;
            }

            // 创建分析器节点
            analyser2 = audioContextWaveform.createAnalyser();

            // 设置分析器参数
            analyser2.fftSize = 256;

            // 设置平滑值
            analyser2.smoothingTimeConstant = 0.8;

            // 获取最新的audio元素引用

            // 连接audio2到分析器
            // 修改为连接Web Audio API的节点
            if (audio2Buffer && audioContextWaveform) {
                try {
                    source2 = audioContextWaveform.createBufferSource();
                    source2.buffer = audio2Buffer;

                    // 创建增益节点用于音量控制
                    const gainNode = audioContextWaveform.createGain();
                    source2.connect(gainNode);
                    gainNode.connect(analyser2);
                    analyser2.connect(audioContextWaveform.destination);
                } catch (e) {
                    console.warn('无法连接audio2到分析器:', e);
                }
            }

            isAudioContextInitialized = true;

            // 开始绘制波形
            drawWaveform();

            // 请求麦克风权限并开始录制
            requestMicrophoneAccess();
        }

        // 在用户交互后初始化音频上下文
        document.addEventListener('click', initWaveform, { once: true });
        document.addEventListener('touchstart', initWaveform, { once: true });
        document.addEventListener('keydown', initWaveform, { once: true });
        // 在音频播放时也尝试初始化
        document.addEventListener('click', function () {
            initWaveform();
            // 确保音频上下文正在运行
            if (audioContextWaveform && audioContextWaveform.state === 'suspended') {
                audioContextWaveform.resume();
            }
        }, { once: true });

        // 请求麦克风访问权限
        function requestMicrophoneAccess() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                    .then(function (stream) {
                        micStream = stream;
                        // 创建麦克风源并连接到分析器
                        const micSource = audioContextWaveform.createMediaStreamSource(stream);

                        // 创建一个新的分析器用于麦克风
                        micAnalyser = audioContextWaveform.createAnalyser();
                        micAnalyser.fftSize = 256;
                        micAnalyser.smoothingTimeConstant = 0.8;
                        micSource.connect(micAnalyser);

                        isRecording = true;
                    })
                    .catch(function (err) {
                        console.error('无法访问麦克风:', err);
                        // 即使没有麦克风权限也继续绘制其他波形
                        isRecording = false;
                    });
            } else {
                console.error('浏览器不支持 getUserMedia API');
                isRecording = false;
            }
        }

        // 绘制音调高低横线（K歌评分效果）
        function drawWaveform() {
            // 如果未初始化则尝试初始化
            if (!isAudioContextInitialized) {
                // 延迟一小段时间再尝试初始化
                setTimeout(initWaveform, 100);
                return;
            }

            if (!canvasCtx || !analyser2) {
                animationFrameId = requestAnimationFrame(drawWaveform);
                return;
            }

            // 确保音频上下文正在运行
            if (audioContextWaveform && audioContextWaveform.state === 'suspended') {
                audioContextWaveform.resume();
            }

            // 清除画布
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            // 设置波形数据数组
            const bufferLength2 = analyser2.frequencyBinCount;
            const dataArray2 = new Uint8Array(bufferLength2);
            let dataArrayMic;

            if (micAnalyser && isRecording) {
                const bufferLengthMic = micAnalyser.frequencyBinCount;
                dataArrayMic = new Uint8Array(bufferLengthMic);
                micAnalyser.getByteFrequencyData(dataArrayMic);
            }

            // 获取音频数据
            try {
                analyser2.getByteFrequencyData(dataArray2);
            } catch (e) {
                console.warn('获取音频数据时出错:', e);
                animationFrameId = requestAnimationFrame(drawWaveform);
                return;
            }

            // 绘制评分背景线
            drawPitchLines();

            // 绘制人声频谱（蓝色）
            // 修改此处：使人声波形图不受音量控制影响
            drawFrequencyBars(dataArray2, 'rgba(0, 0, 255, 0.7)', canvas.height * 0.5);

            // 绘制麦克风输入频谱（红色）
            if (dataArrayMic) {
                drawFrequencyBars(dataArrayMic, 'rgba(255, 0, 0, 0.9)', canvas.height * 0.75);
            }

            // 继续绘制动画
            animationFrameId = requestAnimationFrame(drawWaveform);
        }

        // 绘制评分背景线
        function drawPitchLines() {
            canvasCtx.lineWidth = 1;

            // 绘制中心线（标准音高线）
            canvasCtx.strokeStyle = '#000';
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height * 0.5);
            canvasCtx.lineTo(canvas.width, canvas.height * 0.5);
            canvasCtx.stroke();

            // 绘制上下参考线
            canvasCtx.strokeStyle = '#ccc';
            // 上参考线
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height * 0.25);
            canvasCtx.lineTo(canvas.width, canvas.height * 0.25);
            canvasCtx.stroke();

            // 下参考线
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height * 0.75);
            canvasCtx.lineTo(canvas.width, canvas.height * 0.75);
            canvasCtx.stroke();

            // 添加刻度标记
            canvasCtx.fillStyle = '#666';
            canvasCtx.font = '12px Arial';
            canvasCtx.textAlign = 'right';
            canvasCtx.fillText('高', canvas.width - 10, 20);
            canvasCtx.fillText('中', canvas.width - 10, canvas.height * 0.5 - 5);
            canvasCtx.fillText('低', canvas.width - 10, canvas.height - 5);
        }

        // 绘制频率条
        function drawFrequencyBars(dataArray, color, centerY) {
            const barWidth = (canvas.width / dataArray.length) * 2.5;
            let barHeight;
            let x = 0;

            canvasCtx.fillStyle = color;

            for (let i = 0; i < dataArray.length; i++) {
                barHeight = dataArray[i] / 255 * (canvas.height / 4);

                canvasCtx.fillRect(
                    x,
                    centerY - barHeight,  // 修改: 从左对齐而不是居中
                    barWidth,
                    barHeight
                );

                x += barWidth + 1;
            }
        }

        // 窗口大小改变时重置canvas尺寸
        window.addEventListener('resize', function () {
            if (canvas) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
        });

        // 页面加载完成后尝试初始化波形图
        window.addEventListener('load', function () {
            // 延迟初始化以确保音频元素已加载
            setTimeout(initWaveform, 500);
        });
    </script>
