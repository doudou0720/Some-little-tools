    <script>
        // 添加WebSocket连接相关代码
        let ws = null;
        let isRemoteConnected = false;
        // 使用从模板传递的session_id
        let sessionId = "{{ session_id }}";
        // 添加心跳相关变量
        let heartbeatInterval = null;
        
        function connectWebSocket() {
            try {
                // 修改WebSocket连接URL，使用路径参数传递session_id
                ws = new WebSocket(`ws://${window.location.host}/websocket/${sessionId}`);
                
                ws.onopen = function(event) {
                    console.log("WebSocket连接已建立");
                    isRemoteConnected = true;
                    updateRemoteStatus();
                    // 连接成功后主动发送状态请求
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({type: 'get_status'}));
                        ws.send(JSON.stringify({type: 'get_volume'}));
                    }
                    // 启动心跳
                    startHeartbeat();
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        handleRemoteCommand(data);
                    } catch (e) {
                        console.error("处理远程命令出错:", e);
                    }
                };
                
                ws.onclose = function(event) {
                    console.log("WebSocket连接已关闭");
                    isRemoteConnected = false;
                    updateRemoteStatus();
                    stopHeartbeat();
                    // 尝试重连
                    setTimeout(connectWebSocket, 3000);
                };
                
                ws.onerror = function(error) {
                    console.error("WebSocket错误:", error);
                };
            } catch (e) {
                console.error("WebSocket连接失败:", e);
            }
        }
        
        // 心跳机制
        function startHeartbeat() {
            stopHeartbeat();
            heartbeatInterval = setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({type: 'ping'}));
                }
            }, 5000); // 每5秒发送一次心跳
        }
        
        function stopHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }
        
        function updateRemoteStatus() {
            // 可以在这里更新遥控状态显示
        }
        
        function handleRemoteCommand(data) {
            switch(data.command) {
                case 'play':
                    if (audio1.paused) {
                        audio1.play();
                        audio2.play();
                        // 确保发送播放状态更新
                        if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                            ws.send(JSON.stringify({type: 'playback_status', status: 'playing'}));
                        }
                    }
                    break;
                case 'pause':
                    if (!audio1.paused) {
                        audio1.pause();
                        audio2.pause();
                        // 确保发送暂停状态更新
                        if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                            ws.send(JSON.stringify({type: 'playback_status', status: 'paused'}));
                        }
                    }
                    break;
                case 'volume_up':
                    audio1.volume = Math.min(1.0, audio1.volume + 0.1);
                    audio2.volume = Math.min(1.0, audio2.volume + 0.1);
                    updateVolumeDisplay();
                    break;
                case 'volume_down':
                    audio1.volume = Math.max(0.0, audio1.volume - 0.1);
                    audio2.volume = Math.max(0.0, audio2.volume - 0.1);
                    updateVolumeDisplay();
                    break;
                case 'set_volume':
                    if (data.target === 'audio1' || data.target === 'both') {
                        audio1.volume = Math.max(0.0, Math.min(1.0, data.value));
                    }
                    if (data.target === 'audio2' || data.target === 'both') {
                        audio2.volume = Math.max(0.0, Math.min(1.0, data.value));
                    }
                    updateVolumeDisplay();
                    break;
                case 'seek':
                    if (data.value !== undefined) {
                        audio1.currentTime = data.value;
                        audio2.currentTime = data.value;
                        // 通知遥控器位置更新
                        if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                            ws.send(JSON.stringify({
                                type: 'position_update', 
                                currentTime: audio1.currentTime,
                                duration: audio1.duration
                            }));
                        }
                    }
                    break;
                // 添加切歌处理
                case 'change_song':
                    if (data.song_name) {
                        window.location.href = `/play?name=${encodeURIComponent(data.song_name)}&session_id=${encodeURIComponent(sessionId)}`;
                    }
                    break;
                // 添加获取状态处理
                case 'get_status':
                    if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                        ws.send(JSON.stringify({
                            type: 'playback_status',
                            status: audio1.paused ? 'paused' : 'playing'
                        }));
                        ws.send(JSON.stringify({
                            type: 'position_update',
                            currentTime: audio1.currentTime,
                            duration: audio1.duration
                        }));
                    }
                    break;
                // 添加获取音量处理
                case 'get_volume':
                    updateVolumeDisplay();
                    break;
                // 添加心跳响应
                case 'ping':
                    if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                        ws.send(JSON.stringify({type: 'pong'}));
                    }
                    break;
            }
            
            // 处理服务器消息类型
            switch(data.type) {
                case 'session_id':
                    // 处理session_id
                    break;
                case 'playback_status':
                    // 处理播放状态
                    break;
                case 'volume_update':
                    // 处理音量更新
                    break;
                case 'position_update':
                    // 处理位置更新
                    break;
            }
        }
        
        function updateVolumeDisplay() {
            document.getElementById('audio1-volume').value = audio1.volume;
            document.getElementById('audio2-volume').value = audio2.volume;
            document.getElementById('audio1-volume-value').textContent = Math.round(audio1.volume * 100) + '%';
            document.getElementById('audio2-volume-value').textContent = Math.round(audio2.volume * 100) + '%';
            
            // 发送音量更新到遥控器
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'volume_update',
                    audio1: audio1.volume,
                    audio2: audio2.volume
                }));
            }
        }
        
        function showText() {
            $("#CardText").css("display", "")
            ChangeCard()
        }

        function hideText() {
            $("#CardText").css("display", "none")
            ChangeCard()
        }
        
        // 添加二维码相关函数
        function showQRCode() {
            if (!sessionId) {
                alert("尚未建立遥控器连接，请稍后重试");
                return;
            }
            
            const modal = document.getElementById("qr-modal");
            const qrCodeContainer = document.getElementById("qr-code-container");
            
            // 清空之前的二维码
            qrCodeContainer.innerHTML = "";
            
            // 生成二维码
            const remoteUrl = `${window.location.origin}/remote?session_id=${sessionId}`;
            
            // 使用本地qrcode.js库生成二维码
            const qrCode = new QRCode(qrCodeContainer, {
                text: remoteUrl,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            
            modal.style.display = "block";
        }
        
        function closeQRCode() {
            document.getElementById("qr-modal").style.display = "none";
        }
        
        // 添加音频同步校准相关函数
        function calibrateAudio() {
            document.getElementById('calibration-status').textContent = '校准中';
            // 记录当前时间作为校准点
            const calibrateTime = audio1.currentTime;
            syncAudioSeek(audio2, calibrateTime);
            
            // 发送校准完成消息到遥控器
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'audio_calibrated',
                    time: calibrateTime
                }));
            }
            
            // 更新校准状态显示
            document.getElementById('calibration-status').textContent = '已校准';
            document.getElementById('last-calibration').textContent = new Date().toLocaleTimeString();
        }
        
        // 定期检查音频同步状态
        function checkAudioSync() {
            const timeDiff = Math.abs(audio1.currentTime - audio2.currentTime);
            const syncStatusEl = document.getElementById('sync-status');
            
            // 如果时间差超过0.1秒，则显示不同步
            if (timeDiff > 0.1) {
                syncStatusEl.textContent = '不同步 (' + timeDiff.toFixed(3) + 's)';
                syncStatusEl.className = 'text-danger';
            } else {
                syncStatusEl.textContent = '同步正常';
                syncStatusEl.className = 'text-success';
            }
            
            // 发送同步状态到遥控器
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'sync_status',
                    diff: timeDiff,
                    status: timeDiff > 0.1 ? 'desync' : 'sync'
                }));
            }
        }
    </script>

    <script src="{{ url_for('static',filename='js/jquery-3.6.1.js') }}"></script>
    <script>
        var audio1 = document.getElementById("audio1");
        var audio2 = document.getElementById("audio2");
        var play = $("#lrc_row1");
        var ms = 0;
        var is_controled = false;
        var syncTimeout = null;

        // 音频同步控制
        audio1.addEventListener('play', function () {
            syncAudioPlay(audio2);
            // 通知遥控器播放状态
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({type: 'playback_status', status: 'playing'}));
            }
        });

        audio1.addEventListener('pause', function () {
            syncAudioPause(audio2);
            // 通知遥控器暂停状态
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({type: 'playback_status', status: 'paused'}));
            }
        });

        audio1.addEventListener('seeking', function () {
            syncAudioSeek(audio2, audio1.currentTime);
        });
        
        audio1.addEventListener('seeked', function () {
            syncAudioSeek(audio2, audio1.currentTime);
            if (!audio1.paused) {
                syncAudioPlay(audio1);
                syncAudioPlay(audio2);
            }
            // 通知遥控器位置更新
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({
                    type: 'position_update', 
                    currentTime: audio1.currentTime,
                    duration: audio1.duration
                }));
            }
        });
        
        // 添加播放进度更新
        audio1.addEventListener('timeupdate', function() {
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                // 每秒发送一次进度更新
                if (Math.floor(audio1.currentTime) % 1 === 0) {
                    ws.send(JSON.stringify({
                        type: 'position_update', 
                        currentTime: audio1.currentTime,
                        duration: audio1.duration
                    }));
                }
            }
        });
        
        // 添加对audio2事件的监听，实现双向同步控制
        audio2.addEventListener('play', function () {
            syncAudioPlay(audio1);
            // 通知遥控器播放状态
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({type: 'playback_status', status: 'playing'}));
            }
        });

        audio2.addEventListener('pause', function () {
            syncAudioPause(audio1);
            // 通知遥控器暂停状态
            if (ws && ws.readyState === WebSocket.OPEN && sessionId) {
                ws.send(JSON.stringify({type: 'playback_status', status: 'paused'}));
            }
        });
        
        audio2.addEventListener('seeking', function () {
            syncAudioSeek(audio1, audio2.currentTime);
        });
        
        audio2.addEventListener('seeked', function () {
            syncAudioSeek(audio1, audio2.currentTime);
            if (!audio2.paused) {
                syncAudioPlay(audio1);
                syncAudioPlay(audio2);
            }
        });

        // 同步播放函数
        function syncAudioPlay(audio) {
            if (audio.paused) {
                audio.play().catch(function(e) {
                    console.log(audio.id + " play error:", e);
                });
            }
        }

        // 同步暂停函数
        function syncAudioPause(audio) {
            if (!audio.paused) {
                audio.pause();
            }
        }

        // 同步跳转函数
        function syncAudioSeek(audio, time) {
            if (Math.abs(audio.currentTime - time) > 0.1) {
                audio.currentTime = time;
            }
        }

        // 音量控制
        document.getElementById('audio1-volume').addEventListener('input', function (e) {
            var volume = parseFloat(e.target.value);
            audio1.volume = volume;
            document.getElementById('audio1-volume-value').textContent = Math.round(volume * 100) + '%';
            updateVolumeDisplay();
        });

        document.getElementById('audio2-volume').addEventListener('input', function (e) {
            var volume = parseFloat(e.target.value);
            audio2.volume = volume;
            document.getElementById('audio2-volume-value').textContent = Math.round(volume * 100) + '%';
            updateVolumeDisplay();
        });
        
        // 使用Promise改进歌词加载
        function LoadLrc() {
            return new Promise(function(resolve, reject) {
                // 加载歌词
                $('#div_1').load("{{ url_for('static',filename='audios/'+name_lrc) }}", function(response, status, xhr) {
                    if (status == "error") {
                        reject("加载歌词失败: " + xhr.status + " " + xhr.statusText);
                        return;
                    }
                    
                    // 获取所有歌词
                    setTimeout(function () {
                        try {
                            var lrcArr = $("#div_1").text().split('\n');
                            // 清空之前的歌词
                            $("#div_lrc").empty();
                            
                            // 添加初始行
                            var firstP = document.createElement("p");
                            firstP.id = "lrc_row1";
                            firstP.dataset.minute = "0";
                            firstP.dataset.second = "0";
                            firstP.innerText = "";
                            $("#div_lrc").append(firstP);
                            
                            for (var i = 0; i < lrcArr.length; i++) {
                                // 空白歌词不进行加载
                                if (lrcArr[i].substring(11) != "") {
                                    var p = document.createElement("p");
                                    var timeMatch = lrcArr[i].match(/\[(\d+):(\d+\.\d+)]/);
                                    if (timeMatch) {
                                        p.innerText = lrcArr[i].substring(timeMatch[0].length);
                                        p.dataset.minute = parseInt(timeMatch[1]);
                                        p.dataset.second = parseFloat(timeMatch[2]);
                                        $("#div_lrc").append(p);
                                    }
                                }
                            }
                            play = $("#lrc_row1");
                            resolve();
                        } catch (e) {
                            reject("解析歌词出错: " + e.message);
                        }
                    }, 300); // 稍微增加延迟确保内容加载完成
                });
            });
        }
        
        $(document).ready(function () {
            LoadLrc().then(function() {
                console.log("歌词加载完成");
            }).catch(function(error) {
                console.error("歌词加载失败:", error);
            });
            
            // 页面加载完成后连接WebSocket
            connectWebSocket();
            
            // 启动音频同步检查定时器，每2秒检查一次
            setInterval(checkAudioSync, 500);
        });

        function lrcDisplay() {
            // 使用第一个音频作为时间基准进行歌词同步
            if (!audio1 || audio1.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                return;
            }

            // 获取播放进度(转换的格式为: 00:00)
            var currentTime = audio1.currentTime;
            var minute = Math.floor(currentTime / 60); // 分钟
            var second = currentTime % 60; // 秒数

            // 查找当前应该显示的歌词
            var currentElement = $("#lrc_row1");
            $('#div_lrc > p').each(function () {
                var min = parseInt($(this).data('minute')) || 0;
                var sec = parseFloat($(this).data('second')) || 0;

                if (min < minute || (min === minute && sec <= second)) {
                    currentElement = $(this);
                } else {
                    return false; // 跳出循环
                }
            });

            // 更新高亮显示的歌词
            if (!currentElement.is(play)) {
                $('#div_lrc > p').removeClass('play overPlay');
                play = currentElement;
                play.addClass('play');

                // 将已播放的歌词标记为已播放
                play.prevAll().addClass('overPlay');

                // 歌词滚动到屏幕中央
                var container = $(".div_DisLrc");
                var containerHeight = container.height();
                var elementTop = play.position().top;
                var elementHeight = play.outerHeight(true);
                var targetTop = (containerHeight / 2) - (elementHeight / 2) - elementTop;

                $("#div_lrc").css("top", targetTop + "px");
            }
        }

        // 定时更新歌词显示
        setInterval(lrcDisplay, 100);

        //歌词滚动(手动)
        function btn_top() {
            var top = parseInt($("#div_lrc").css("top"));
            $("#div_lrc").css("top", (top + 30) + "px");
        }

        function btn_down() {
            var top = parseInt($("#div_lrc").css("top"));
            $("#div_lrc").css("top", (top - 30) + "px");
        }

        //调整歌词位置的函数
        function btn_top() {
            var top = parseInt($("#div_lrc").css("top"));
            $("#div_lrc").css("top", (top + 30) + "px");
        }
        /*
            1.歌词文件不能是默认编码(记事本文件和lrc文件默认为ANSI编码) 只需要改为 UTF-8或
者GB2312,否则乱码
            2.歌曲因为没有算毫秒差距,可能出现细微误差
            3.因为网页同源策略的原因,外部直接打开html文件只能用firefox访问,
               不能进行跨域访问,如果不使用文件读取可以在任意地方打开.
            4.因为ajax识别原因,会把空格当做分割内容,即歌词文件名不能有空格
            5.因为js对文件操作以及ajax请求存在诸多默认限制,若以类似方法在winfrom asp等中很
多问题都会得到解决.
            6.setTimeout()和setInterval()，在浏览器窗口非激活的状态下会停止工作或者以极慢的
速度工作。目前我已知就IE不会有这种问题。
        */
    </script>
    <script>
        const ChangeCard = () => {
            var card_height = $("#ShowInfo").outerHeight(true);
            var card_top = ($(document).height() / 2) - (card_height / 2);
            $("#ShowInfo").css("top", card_top)
            // $("#div_lrc").css("top", ($(document).height() / 4) + "px");
            ms = 0;
        }
        const debounce = (fn, delay) => {
            let timer;
            return function () {
                if (timer) {
                    clearTimeout(timer);
                }
                timer = setTimeout(() => {
                    fn();
                }, delay);
            }
        };
        const cancalDebounce = debounce(ChangeCard, 200);

        window.addEventListener('resize', cancalDebounce);
        $(document).ready(ChangeCard());
    </script>

    <!-- 波形图相关脚本 -->
    <script>
        // 波形图绘制相关变量
        let audioContext;
        let analyser2;
        let source2;
        let canvas, canvasCtx;
        let micStream;
        let isRecording = false;
        let isAudioContextInitialized = false;
        let animationFrameId;
        let micAnalyser;

        // 初始化波形图 - 改为在用户交互后初始化
        function initWaveform() {
            // 防止重复初始化
            if (isAudioContextInitialized) return;

            canvas = document.getElementById('waveform');
            canvasCtx = canvas.getContext('2d');

            // 设置canvas尺寸
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            // 初始化音频上下文
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                // 在用户手势后恢复音频上下文
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            } catch (e) {
                console.error('Web Audio API is not supported in this browser', e);
                return;
            }

            // 创建分析器节点
            analyser2 = audioContext.createAnalyser();

            // 设置分析器参数
            analyser2.fftSize = 256;

            // 设置平滑值
            analyser2.smoothingTimeConstant = 0.8;

            // 获取最新的audio元素引用
            const audio2 = document.getElementById("audio2");

            // 连接audio2到分析器
            if (audio2 && audioContext) {
                try {
                    source2 = audioContext.createMediaElementSource(audio2);
                    source2.connect(analyser2);
                    analyser2.connect(audioContext.destination);
                } catch (e) {
                    console.warn('无法连接audio2到分析器:', e);
                }
            }

            isAudioContextInitialized = true;

            // 开始绘制波形
            drawWaveform();

            // 请求麦克风权限并开始录制
            requestMicrophoneAccess();
        }

        // 在用户交互后初始化音频上下文
        document.addEventListener('click', initWaveform, { once: true });
        document.addEventListener('touchstart', initWaveform, { once: true });
        document.addEventListener('keydown', initWaveform, { once: true });
        // 在音频播放时也尝试初始化
        document.getElementById("audio1").addEventListener('play', function () {
            initWaveform();
            // 确保音频上下文正在运行
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }, { once: true });

        // 请求麦克风访问权限
        function requestMicrophoneAccess() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                    .then(function (stream) {
                        micStream = stream;
                        // 创建麦克风源并连接到分析器
                        const micSource = audioContext.createMediaStreamSource(stream);

                        // 创建一个新的分析器用于麦克风
                        micAnalyser = audioContext.createAnalyser();
                        micAnalyser.fftSize = 256;
                        micAnalyser.smoothingTimeConstant = 0.8;
                        micSource.connect(micAnalyser);

                        isRecording = true;
                    })
                    .catch(function (err) {
                        console.error('无法访问麦克风:', err);
                        // 即使没有麦克风权限也继续绘制其他波形
                        isRecording = false;
                    });
            } else {
                console.error('浏览器不支持 getUserMedia API');
                isRecording = false;
            }
        }

        // 绘制音调高低横线（K歌评分效果）
        function drawWaveform() {
            // 如果未初始化则尝试初始化
            if (!isAudioContextInitialized) {
                // 延迟一小段时间再尝试初始化
                setTimeout(initWaveform, 100);
                return;
            }

            if (!canvasCtx || !analyser2) {
                animationFrameId = requestAnimationFrame(drawWaveform);
                return;
            }

            // 确保音频上下文正在运行
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }

            // 清除画布
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            // 设置波形数据数组
            const bufferLength2 = analyser2.frequencyBinCount;
            const dataArray2 = new Uint8Array(bufferLength2);
            let dataArrayMic;

            if (micAnalyser && isRecording) {
                const bufferLengthMic = micAnalyser.frequencyBinCount;
                dataArrayMic = new Uint8Array(bufferLengthMic);
                micAnalyser.getByteFrequencyData(dataArrayMic);
            }

            // 获取音频数据
            try {
                analyser2.getByteFrequencyData(dataArray2);
            } catch (e) {
                console.warn('获取音频数据时出错:', e);
                animationFrameId = requestAnimationFrame(drawWaveform);
                return;
            }

            // 绘制评分背景线
            drawPitchLines();

            // 绘制人声频谱（蓝色）
            // 修改此处：使人声波形图不受音量控制影响
            drawFrequencyBars(dataArray2, 'rgba(0, 0, 255, 0.7)', canvas.height * 0.5);

            // 绘制麦克风输入频谱（红色）
            if (dataArrayMic) {
                drawFrequencyBars(dataArrayMic, 'rgba(255, 0, 0, 0.9)', canvas.height * 0.75);
            }

            // 继续绘制动画
            animationFrameId = requestAnimationFrame(drawWaveform);
        }

        // 绘制评分背景线
        function drawPitchLines() {
            canvasCtx.lineWidth = 1;

            // 绘制中心线（标准音高线）
            canvasCtx.strokeStyle = '#000';
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height * 0.5);
            canvasCtx.lineTo(canvas.width, canvas.height * 0.5);
            canvasCtx.stroke();

            // 绘制上下参考线
            canvasCtx.strokeStyle = '#ccc';
            // 上参考线
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height * 0.25);
            canvasCtx.lineTo(canvas.width, canvas.height * 0.25);
            canvasCtx.stroke();

            // 下参考线
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height * 0.75);
            canvasCtx.lineTo(canvas.width, canvas.height * 0.75);
            canvasCtx.stroke();

            // 添加刻度标记
            canvasCtx.fillStyle = '#666';
            canvasCtx.font = '12px Arial';
            canvasCtx.textAlign = 'right';
            canvasCtx.fillText('高', canvas.width - 10, 20);
            canvasCtx.fillText('中', canvas.width - 10, canvas.height * 0.5 - 5);
            canvasCtx.fillText('低', canvas.width - 10, canvas.height - 5);
        }

        // 绘制频率条
        function drawFrequencyBars(dataArray, color, centerY) {
            const barWidth = (canvas.width / dataArray.length) * 2.5;
            let barHeight;
            let x = 0;

            canvasCtx.fillStyle = color;

            for (let i = 0; i < dataArray.length; i++) {
                barHeight = dataArray[i] / 255 * (canvas.height / 4);

                canvasCtx.fillRect(
                    x,
                    centerY - barHeight / 2,
                    barWidth,
                    barHeight
                );

                x += barWidth + 1;
            }
        }

        // 窗口大小改变时重置canvas尺寸
        window.addEventListener('resize', function () {
            if (canvas) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
        });

        // 页面加载完成后尝试初始化波形图
        window.addEventListener('load', function () {
            // 延迟初始化以确保音频元素已加载
            setTimeout(initWaveform, 500);
        });
    </script>
