<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>歌词同步</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bootstrap.min.css') }}" />
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='css/bootstrap-icons.min.css') }}" />
    <script src="{{ url_for('static',filename='js/bootstrap.bundle.js') }}"></script>
    <style>
        body {
            background-size: 60% 100%;
        }

        * {
            margin: 0 auto;
            padding: 0;
        }

        .play {
            color: #01e5ff;
            font-size: 24px;
        }

        .overPlay {
            font-size: inherit;
            color: #c9c9c9;
        }

        #div_lrc {
            position: absolute;
            padding-top: 0px;
            left: 28%;
            top: 300px;
            width: 50%;
            transition: top .5s;
            margin: 0 auto;

        }

        .div_DisLrc {
            overflow: hidden;
            color: #b1abab;
            height: 600px;
            position: relative;
            margin: 0 auto;

        }

        #audio {
            width: 100%;
        }

        .div_audio {
            width: 50%;
            margin: 0 auto;
        }

        .div_but {
            position: absolute;
            font-size: 26px;
            font-weight: 900;
            top: 40%;
            right: 0%;
        }

        .div_but p {
            cursor: pointer;
        }

        .card {
            transition: top 0.3s, display 0.5s;
        }

        #waveform {
            width: 100%;
            height: 200px;
            background-color: #fff;
        }

        .volume-control {
            margin: 10px 0;
        }
    </style>
</head>



<body>
    <script>
        function showText() {
            $("#CardText").css("display", "")
            ChangeCard()
        }

        function hideText() {
            $("#CardText").css("display", "none")
            ChangeCard()
        }
    </script>
    <nav class="navbar fixed-top bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Title</a>
        </div>
    </nav>
    <div id="div_1" style="display: none;">
    </div>
    <div class="row">
        <div class="col-5">
            <div id="ShowInfo" class="card" style="width: 18rem;top:auto;" onmouseover="showText()"
                onmouseout="hideText()">
                <img src="{{ url_for('static',filename='images/'+img)}}" class="card-img-top" alt="...">
                <div id="CardText" class="card-body" style="display:none;">
                    <p class="bi bi-file-earmark-music card-text">{{song_name}}</p>
                    <p class="bi bi-person card-text">{{singer}}</p>
                    <p class="bi bi-disc card-text">{{disc}}</p>
                </div>
            </div>
        </div>
        <!-- 歌词显示界面 -->
        <div class="col-7 div_DisLrc">
            <div id="div_lrc">
                <p id="lrc_row1" data-second="0" data-minute="0"></p>
            </div>
        </div>
    </div>

    <!-- 波形图显示 -->
    <div class="row mt-3">
        <div class="col-12">
            <canvas id="waveform"></canvas>
        </div>
    </div>

    <!-- 音量控制 -->
    <div class="row mt-3">
        <div class="col-6">
            <div class="volume-control">
                <label for="audio1-volume">伴奏音量:</label>
                <input type="range" id="audio1-volume" min="0" max="1" step="0.01" value="1">
                <span id="audio1-volume-value">100%</span>
            </div>
        </div>
        <div class="col-6">
            <div class="volume-control">
                <label for="audio2-volume">人声音量:</label>
                <input type="range" id="audio2-volume" min="0" max="1" step="0.01" value="1">
                <span id="audio2-volume-value">100%</span>
            </div>
        </div>
    </div>

    <!-- 播放器控件 -->
    <nav class="navbar fixed-bottom bg-body-tertiary">
        <div class="container-fluid">
            <div class="div_audio">
                <audio id="audio1" controls="controls" autoplay="autoplay">
                    <source src="{{ url_for('static',filename='audios/'+name_ins) }}" type="audio/mpeg">
                </audio>
                <audio id="audio2" controls="controls" autoplay="autoplay">
                    <source src="{{ url_for('static',filename='audios/'+name_vol) }}" type="audio/mpeg">
                </audio>
            </div>
        </div>
    </nav>




    <script src="{{ url_for('static',filename='js/jquery-3.6.1.js') }}"></script>
    <script>
        var audio1 = document.getElementById("audio1");
        var audio2 = document.getElementById("audio2");
        var play = $("#lrc_row1");
        var ms = 0;
        var is_controled = false;

        // 音频同步控制
        audio1.addEventListener('play', function () {
            audio2.play();
        });

        audio1.addEventListener('pause', function () {
            audio2.pause();
        });

        audio1.addEventListener('seeking', function () {
            audio2.currentTime = audio1.currentTime;
        });

        // 音量控制
        document.getElementById('audio1-volume').addEventListener('input', function (e) {
            var volume = parseFloat(e.target.value);
            audio1.volume = volume;
            document.getElementById('audio1-volume-value').textContent = Math.round(volume * 100) + '%';
        });

        document.getElementById('audio2-volume').addEventListener('input', function (e) {
            var volume = parseFloat(e.target.value);
            audio2.volume = volume;
            document.getElementById('audio2-volume-value').textContent = Math.round(volume * 100) + '%';
        });
        function LoadLrc() {
            //加载歌词
            $('#div_1').load("{{ url_for('static',filename='audios/'+name_lrc) }}");
            //获取所有歌词
            setTimeout(function () {
                var lrcArr = $("#div_1").text().split('\n');
                // debugger;
                for (var i = 0; i < lrcArr.length; i++) {
                    var p = document.createElement("p");
                    //空白歌词不进行加载
                    if (lrcArr[i].substring(11) != "") {
                        // debugger;
                        var num_l = (lrcArr[i]).match(/\d+/g);
                        p.innerText = lrcArr[i].substring(11);
                        p.dataset.minute = Number(num_l[0]);
                        p.dataset.second = Number(num_l[1]);
                        $("#div_lrc").append(p);
                    }
                }
            }, 200)
        }
        
        function lrcDisplay() {
            // 使用第一个音频作为时间基准进行歌词同步
            //获取播放进度(转换的格式为: 00:00)
            var minute = parseInt(audio1.currentTime / 60);//分钟
            minute = minute == 0 ? "00" : (minute + "").length < 2 ? "0" + minute : minute;
            //获取秒数
            var second = (parseInt(audio1.currentTime)) % 60;
            second = second == 0 ? "00" : (second + "").length < 2 ? "0" + second : second;
            //正则表达匹配歌词
            //console.log(minute,second)
            var regex = new RegExp('\\[' + (minute + ":" + second) + '.+\\].+\n');
            var text = regex.exec($("#div_1").text());
            // debugger;
            // console.log(is_controled,((ms > 100 * minute + second)||((100 * minute + second)-ms > 2))&& !is_controled);
            if (((ms > 100 * Number(minute) + Number(second)) || ((100 * Number(minute) + Number(second)) - ms > 2)) && !is_controled) {
                play = $("#lrc_row1");
                $('#div_lrc > *').each(function (index) {
                    // 对每个 div 元素执行操作
                    // console.log('第 ' + index + ' 个 div');
                    $(this).removeClass()
                });
                is_controled = true;
                var cnt = 1;
                // debugger;
                var d_c = 0;
                while (cnt == 1) {
                    cnt = lrcDisplay()
                    // console.log(cnt);
                    // alert(cnt);
                    // debugger;
                    d_c++;
                };
                var cnt = 0;
                //歌词滚动(自动)

                var now_top = $("#div_lrc").offset().top - (($(play).offset().top) - (($(document).height() / 2) - ($(play).outerHeight(true) / 2)))
                $("#div_lrc").css("top", now_top + "px");
                is_controled = false;

            } ms = 100 * Number(minute) + Number(second)
            if (text != null) {
                // console.log(text)
                var str1 = new String($(play).next().text());
                var str2 = new String(text[0].substring(11));

                if (str1.trim() == str2.trim()) {
                    //歌词颜色变色
                    $(play).attr("class", "overPlay");
                    play = $(play).next();
                    $(play).attr("class", "play");
                    //歌词滚动(自动)
                    var now_top = $("#div_lrc").offset().top - (($(play).offset().top) - (($(document).height() / 2) - ($(play).outerHeight(true) / 2)))
                    $("#div_lrc").css("top", now_top + "px");

                    return 1;
                }
            }
            // if (is_controled) { debugger; }

            // 修改: 添加检查防止访问未定义元素的dataset属性
            var nextElement = $(play).next();
            // if (nextElement.length === 0) {
            //     return 0;
            // }

            if ($(play).text() == "") {
                var min = 0;
                var sec = 0;
            } else {
                // 修改: 添加检查防止访问未定义元素的dataset属性
                var nextDOMElement = nextElement[0];
                if (nextDOMElement && nextDOMElement.dataset) {
                    var min = Number(nextDOMElement.dataset.minute);
                    var sec = Number(nextDOMElement.dataset.second);
                } else {
                    var min = 0;
                    var sec = 0;
                }
            }
            if (is_controled) {//  ms当前时间
                // alert(num_l,minute,second)
                if (min <= Number(minute) && (min < Number(minute)) || (min == Number(minute) && sec <= Number(second))) {
                    // debugger;
                    //歌词颜色变色
                    $(play).attr("class", "overPlay");
                    var nextPlay = $(play).next();
                    // 修改: 添加检查防止将play设置为未定义的元素
                    if (nextPlay.length > 0) {
                        play = nextPlay;
                        $(play).attr("class", "play");
                    }

                    return 1;
                }
            }
            return 0;
        }
        //将歌词添加到div中
        $(document).ready(function (){LoadLrc;setInterval(lrcDisplay, 200);});
        //歌词滚动(手动)
        var time = null;
        function btn_top() {
            var top = parseInt($("#div_lrc").css("top"));
            $("#div_lrc").css("top", -1 * ((-1 * top) + 100) + "px");
        }
        function btn_down() {
            var top = parseInt($("#div_lrc").css("top"));
            if (top <= 0)
                $("#div_lrc").css("top", -1 * ((-1 * top) - 100) + "px");
        }

        //调整歌词位置的函数
        function btn_top() {
            var top = parseInt($("#div_lrc").css("top"));
            $("#div_lrc").css("top", -1 * ((-1 * top) + 30) + "px");
        }
        /*
            1.歌词文件不能是默认编码(记事本文件和lrc文件默认为ANSI编码) 只需要改为 UTF-8或
者GB2312,否则乱码
            2.歌曲因为没有算毫秒差距,可能出现细微误差
            3.因为网页同源策略的原因,外部直接打开html文件只能用firefox访问,
               不能进行跨域访问,如果不使用文件读取可以在任意地方打开.
            4.因为ajax识别原因,会把空格当做分割内容,即歌词文件名不能有空格
            5.因为js对文件操作以及ajax请求存在诸多默认限制,若以类似方法在winfrom asp等中很
多问题都会得到解决.
            6.setTimeout()和setInterval()，在浏览器窗口非激活的状态下会停止工作或者以极慢的
速度工作。目前我已知就IE不会有这种问题。
        */
    </script>
    <script>
        const ChangeCard = () => {
            var card_height = $("#ShowInfo").outerHeight(true);
            var card_top = ($(document).height() / 2) - (card_height / 2);
            $("#ShowInfo").css("top", card_top)
            // $("#div_lrc").css("top", ($(document).height() / 4) + "px");
            ms = 0;
        }
        const debounce = (fn, delay) => {
            let timer;
            return function () {
                if (timer) {
                    clearTimeout(timer);
                }
                timer = setTimeout(() => {
                    fn();
                }, delay);
            }
        };
        const cancalDebounce = debounce(ChangeCard, 200);

        window.addEventListener('resize', cancalDebounce);
        $(document).ready(ChangeCard());
    </script>

    <!-- 波形图相关脚本 -->
    <script>
        // 波形图绘制相关变量
        let audioContext;
        let analyser1, analyser2;
        let source1, source2;
        let canvas, canvasCtx;
        let micStream;
        let isRecording = false;
        let isAudioContextInitialized = false;

        // 初始化波形图 - 改为在用户交互后初始化
        function initWaveform() {
            // 防止重复初始化
            if (isAudioContextInitialized) return;

            canvas = document.getElementById('waveform');
            canvasCtx = canvas.getContext('2d');

            // 设置canvas尺寸
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            // 初始化音频上下文
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.error('Web Audio API is not supported in this browser', e);
                return;
            }

            // 创建分析器节点
            analyser1 = audioContext.createAnalyser();
            analyser2 = audioContext.createAnalyser();

            // 设置分析器参数
            analyser1.fftSize = 2048;
            analyser2.fftSize = 2048;

            // 连接audio1到分析器
            if (audio1 && audioContext) {
                try {
                    source1 = audioContext.createMediaElementSource(audio1);
                    source1.connect(analyser1);
                    analyser1.connect(audioContext.destination);
                } catch (e) {
                    console.warn('无法连接audio1到分析器:', e);
                }
            }

            // 连接audio2到分析器
            if (audio2 && audioContext) {
                try {
                    source2 = audioContext.createMediaElementSource(audio2);
                    source2.connect(analyser2);
                    analyser2.connect(audioContext.destination);
                } catch (e) {
                    console.warn('无法连接audio2到分析器:', e);
                }
            }

            isAudioContextInitialized = true;

            // 开始绘制波形
            drawWaveform();

            // 请求麦克风权限并开始录制
            requestMicrophoneAccess();
        }

        // 在用户交互后初始化音频上下文
        document.addEventListener('click', initWaveform, { once: true });
        document.addEventListener('touchstart', initWaveform, { once: true });
        document.addEventListener('keydown', initWaveform, { once: true });

        // 请求麦克风访问权限
        function requestMicrophoneAccess() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                    .then(function (stream) {
                        micStream = stream;
                        // 创建麦克风源并连接到分析器
                        const micSource = audioContext.createMediaStreamSource(stream);

                        // 创建一个新的分析器用于麦克风
                        const micAnalyser = audioContext.createAnalyser();
                        micAnalyser.fftSize = 2048;
                        micSource.connect(micAnalyser);

                        // 保存麦克风分析器供绘制使用
                        window.micAnalyser = micAnalyser;
                        isRecording = true;
                    })
                    .catch(function (err) {
                        console.error('无法访问麦克风:', err);
                    });
            } else {
                console.error('浏览器不支持 getUserMedia API');
            }
        }

        // 绘制波形图
        function drawWaveform() {
            if (!canvasCtx || !analyser1 || !analyser2 || !isAudioContextInitialized) return;

            // 清除画布
            canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

            // 设置波形数据数组
            const bufferLength1 = analyser1.frequencyBinCount;
            const bufferLength2 = analyser2.frequencyBinCount;
            const dataArray1 = new Uint8Array(bufferLength1);
            const dataArray2 = new Uint8Array(bufferLength2);
            let dataArrayMic;

            if (window.micAnalyser && isRecording) {
                const bufferLengthMic = window.micAnalyser.frequencyBinCount;
                dataArrayMic = new Uint8Array(bufferLengthMic);
                window.micAnalyser.getByteTimeDomainData(dataArrayMic);
            }

            // 获取音频数据
            try {
                analyser1.getByteTimeDomainData(dataArray1);
                analyser2.getByteTimeDomainData(dataArray2);
            } catch (e) {
                console.warn('获取音频数据时出错:', e);
                requestAnimationFrame(drawWaveform);
                return;
            }

            // 绘制audio2波形（蓝色）
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = 'rgb(0, 0, 255)'; // 蓝色
            canvasCtx.beginPath();

            const sliceWidth1 = canvas.width / bufferLength1;
            let x1 = 0;

            for (let i = 0; i < bufferLength1; i++) {
                const v1 = dataArray1[i] / 128.0;
                const y1 = v1 * canvas.height / 2;

                if (i === 0) {
                    canvasCtx.moveTo(x1, y1);
                } else {
                    canvasCtx.lineTo(x1, y1);
                }

                x1 += sliceWidth1;
            }

            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();

            // 绘制麦克风波形（红色）
            if (dataArrayMic) {
                canvasCtx.lineWidth = 2;
                canvasCtx.strokeStyle = 'rgb(255, 0, 0)'; // 红色
                canvasCtx.beginPath();

                const sliceWidthMic = canvas.width / dataArrayMic.length;
                let xMic = 0;

                for (let i = 0; i < dataArrayMic.length; i++) {
                    const vMic = dataArrayMic[i] / 128.0;
                    const yMic = vMic * canvas.height / 2;

                    if (i === 0) {
                        canvasCtx.moveTo(xMic, yMic);
                    } else {
                        canvasCtx.lineTo(xMic, yMic);
                    }

                    xMic += sliceWidthMic;
                }

                canvasCtx.lineTo(canvas.width, canvas.height / 2);
                canvasCtx.stroke();
            }

            // 继续绘制动画
            requestAnimationFrame(drawWaveform);
        }

        // 窗口大小改变时重置canvas尺寸
        window.addEventListener('resize', function () {
            if (canvas) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
        });
    </script>
</body>

</html>
