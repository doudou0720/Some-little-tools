[project]
name = "classistime"
version = "0.1.0"
description = "A lightweight PyQt6-based class schedule application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.4.0",
    "PyQt6-Qt6>=6.4.0",
]

[project.scripts]
classistime = "classistime.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["Nuitka"]