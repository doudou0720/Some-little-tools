name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install nuitka
    
    - name: Build with Nuitka
      run: |
        python build.py
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: classistime-windows
        path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install nuitka
    
    - name: Build with Nuitka
      run: |
        python build.py
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: classistime-linux
        path: dist/*

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install nuitka
    
    - name: Build with Nuitka
      run: |
        python build.py
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: classistime-macos
        path: dist/*

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          classistime-windows/*.exe
          classistime-linux/*
          classistime-macos/*